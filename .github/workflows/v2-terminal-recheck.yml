name: V2 terminal recheck trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-terminal-recheck.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical V2 restatement terminal verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/v2-correct-20260820-catchup.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch.txt || true
          echo "dispatch_http_code=$code"
          test "$code" = "204"

