name: V2 normalized snapshot smoke (shadow only)

on:
  workflow_dispatch:
  push:
    branches: [v2-shadow]
    paths:
      - 'engine_v2/**'
      - 'tests/test_v2_shadow.py'
      - '.github/workflows/v2-snapshot-smoke.yml'

permissions:
  contents: read

concurrency:
  group: v2-data-validation
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V2 shadow branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run V2 pure-function tests
        run: python -m unittest tests.test_v2_shadow -v

      - name: Resolve latest completed A-share session safely
        id: td
        run: |
          TD=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from engine_v2.data_validation import _safe_requested_date
          print(_safe_requested_date(datetime.now(ZoneInfo('Asia/Shanghai'))).isoformat())
          PY
          )
          echo "date=$TD" >> "$GITHUB_OUTPUT"
          echo "requested_date=$TD"

      - name: Build normalized V2 shadow snapshot once
        run: python -m engine_v2.snapshot --date "${{ steps.td.outputs.date }}" --output /tmp/v2-normalized-snapshot.json

      - name: Assert snapshot invariants
        run: |
          python - <<'PY'
          import json
          s=json.load(open('/tmp/v2-normalized-snapshot.json',encoding='utf-8'))
          print('[V2 SNAPSHOT] trade_date=',s['trade_date'])
          print('[V2 SNAPSHOT] regime=',json.dumps(s['market']['regime'],ensure_ascii=False))
          print('[V2 SNAPSHOT] activity=',json.dumps(s['market']['activity'],ensure_ascii=False))
          print('[V2 SNAPSHOT] industry=',json.dumps(s['industry']['counts'],ensure_ascii=False))
          print('[V2 SNAPSHOT] fundamentals=',json.dumps(s['fundamentals'],ensure_ascii=False))
          print('[V2 SNAPSHOT] preselection_counts=',json.dumps(s['preselection']['counts'],ensure_ascii=False))
          print('[V2 SNAPSHOT] preselection_union=',s['preselection']['union_count'])
          print('[V2 SNAPSHOT] source=',s['source_notes']['stock_snapshot'])
          print('[V2 SNAPSHOT] safety=',json.dumps(s['safety'],ensure_ascii=False))
          if s['market']['activity']['reported_date'] != s['trade_date']:
              raise SystemExit('market activity is not point-in-time current')
          if s['market']['high_low']['date'] != s['trade_date']:
              raise SystemExit('breadth is not point-in-time current')
          if s['industry']['counts']['industries'] < 25 or s['industry']['counts']['mainboard_stocks'] < 2500:
              raise SystemExit('industry coverage too low')
          if s['fundamentals']['scored_stocks'] < 2500:
              raise SystemExit('fundamental baseline coverage too low')
          if not (80 <= s['preselection']['union_count'] <= 180):
              raise SystemExit('preselection union outside expected range')
          if s['safety']['writes_ledgers'] or s['safety']['calls_sol']:
              raise SystemExit('shadow safety invariant violated')
          PY

      - name: Upload normalized snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-normalized-snapshot
          path: /tmp/v2-normalized-snapshot.json
          if-no-files-found: warn
          retention-days: 14
