name: V2 normalized snapshot smoke (shadow only)

on:
  push:
    branches: [v2-shadow]
    paths:
      - '.github/workflows/v2-snapshot-smoke.yml'
      - 'shadow_state/v2/.snapshot-smoke-trigger'

permissions:
  contents: read

concurrency:
  group: v2-snapshot-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V2 shadow branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run all V2 tests
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v

      - name: Resolve latest completed A-share session safely
        id: td
        run: |
          TD=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from engine_v2.data_validation import _safe_requested_date
          print(_safe_requested_date(datetime.now(ZoneInfo('Asia/Shanghai'))).isoformat())
          PY
          )
          echo "date=$TD" >> "$GITHUB_OUTPUT"
          echo "requested_date=$TD"

      - name: Build normalized V2 shadow snapshot once
        run: python -m engine_v2.resilient_snapshot --date "${{ steps.td.outputs.date }}" --output /tmp/v2-normalized-snapshot.json

      - name: Assert snapshot invariants
        run: |
          python - <<'PY'
          import json
          s=json.load(open('/tmp/v2-normalized-snapshot.json',encoding='utf-8'))
          q=s['preselection']['data_quality']
          print('[V2 SNAPSHOT] trade_date=',s['trade_date'])
          print('[V2 SNAPSHOT] regime=',json.dumps(s['market']['regime'],ensure_ascii=False))
          print('[V2 SNAPSHOT] activity=',json.dumps(s['market']['activity'],ensure_ascii=False))
          print('[V2 SNAPSHOT] industry=',json.dumps(s['industry']['counts'],ensure_ascii=False))
          print('[V2 SNAPSHOT] fundamentals=',json.dumps(s['fundamentals'],ensure_ascii=False))
          print('[V2 SNAPSHOT] preselection_counts=',json.dumps(s['preselection']['counts'],ensure_ascii=False))
          print('[V2 SNAPSHOT] preselection_union=',s['preselection']['union_count'])
          print('[V2 SNAPSHOT] data_quality=',json.dumps(q,ensure_ascii=False))
          print('[V2 SNAPSHOT] source=',s['source_notes']['stock_snapshot'])
          print('[V2 SNAPSHOT] universe_mode=',s['source_notes'].get('stock_universe_mode'))
          print('[V2 SNAPSHOT] safety=',json.dumps(s['safety'],ensure_ascii=False))
          if s['market']['activity']['reported_date'] != s['trade_date']:
              raise SystemExit('market activity is not point-in-time current')
          if s['market']['high_low']['date'] != s['trade_date']:
              raise SystemExit('breadth is not point-in-time current')
          if s['industry']['counts']['industries'] < 25 or s['industry']['counts']['mainboard_stocks'] < 2500:
              raise SystemExit('industry coverage too low')
          if s['fundamentals']['scored_stocks'] < 2500:
              raise SystemExit('fundamental baseline coverage too low')
          if not (80 <= s['preselection']['union_count'] <= 180):
              raise SystemExit('preselection union outside expected range')
          if q['preselection_uses_snapshot_pe'] or q['preselection_uses_snapshot_r60']:
              raise SystemExit('broad preselection must not depend on provider-specific PE/R60 fields')
          if q['disclosed_pb_coverage'] < 0.60:
              raise SystemExit('disclosed PB fallback coverage too low')
          if s['source_notes']['stock_snapshot'].lower() == 'sina':
              if q['snapshot_pe_coverage'] != 0.0 or q['snapshot_r60_coverage'] != 0.0:
                  raise SystemExit('Sina missing PE/R60 sentinels were misinterpreted as real data')
          if s['safety']['writes_ledgers'] or s['safety']['calls_sol']:
              raise SystemExit('shadow safety invariant violated')
          if s['safety'].get('ready_for_shadow_accounting'):
              raise SystemExit('snapshot cannot claim accounting readiness before Tencent history enrichment')
          PY

      - name: Enrich preselection with Tencent histories
        run: |
          python -m engine_v2.enrichment_resilient \
            --snapshot /tmp/v2-normalized-snapshot.json \
            --output /tmp/v2-enriched-candidates.json

      - name: Assert history-enrichment invariants
        run: |
          python - <<'PY'
          import json
          e=json.load(open('/tmp/v2-enriched-candidates.json',encoding='utf-8'))
          c=e['candidates']; cov=e['coverage']; safety=e['safety']
          print('[V2 ENRICH] coverage=',json.dumps(cov,ensure_ascii=False))
          print('[V2 ENRICH] safety=',json.dumps(safety,ensure_ascii=False))
          print('[V2 ENRICH] candidates=',len(c))
          industries=sum(1 for x in c if x.get('industry'))
          values=sum(1 for x in c if x.get('valuation_score') is not None)
          limits={k:sum(1 for x in c if x.get('limit_status')==k) for k in ('limit_up','broken_limit','limit_down','normal')}
          print('[V2 ENRICH] industry_coverage=',round(industries/max(1,len(c)),4))
          print('[V2 ENRICH] valuation_score_coverage=',round(values/max(1,len(c)),4))
          print('[V2 ENRICH] limit_status=',json.dumps(limits,ensure_ascii=False))
          if cov['history_ratio'] < 0.85 or cov['feature_ratio'] < 0.80 or len(c) < 100:
              raise SystemExit('Tencent history/feature coverage too low')
          if safety.get('stock_universe_grade') == 'full' and not safety['ready_for_strategy_targets']:
              raise SystemExit('full-universe enrichment did not earn strategy-target readiness')
          if safety.get('stock_universe_grade') != 'full' and safety['ready_for_strategy_targets']:
              raise SystemExit('degraded stock universe must not earn strategy-target readiness')
          if safety['writes_ledgers'] or safety['calls_sol'] or safety['ready_for_shadow_accounting']:
              raise SystemExit('enrichment safety invariant violated')
          required=('trend','momentum','risk','liquidity','breakout_quality','crowding_score','vol20','r20','r60','amount20')
          for x in c:
              if x.get('date') != e['trade_date']:
                  raise SystemExit(f"future/stale feature date: {x.get('raw_code')} {x.get('date')}")
              if any(x.get(k) is None for k in required):
                  raise SystemExit(f"missing required feature: {x.get('raw_code')}")
              if not (0 <= x['trend'] <= 100 and 0 <= x['momentum'] <= 100 and 0 <= x['risk'] <= 100):
                  raise SystemExit(f"score outside 0..100: {x.get('raw_code')}")
              if x['amount20'] <= 0 or x['amount20'] > 200_000_000_000:
                  raise SystemExit(f"suspicious amount20/unit: {x.get('raw_code')} {x['amount20']}")
              if x['vol20'] < 0 or x['vol20'] > 0.25:
                  raise SystemExit(f"suspicious vol20: {x.get('raw_code')} {x['vol20']}")
          if industries/max(1,len(c)) < 0.80:
              raise SystemExit('SW industry mapping coverage too low in enriched candidates')
          PY

      - name: Upload V2 read-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-normalized-snapshot
          path: |
            /tmp/v2-normalized-snapshot.json
            /tmp/v2-enriched-candidates.json
          if-no-files-found: warn
          retention-days: 14

