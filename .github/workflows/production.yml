name: Daily 15:10 conditional-plan settlement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/.production-trigger'
  schedule:
    - cron: '10 7 * * 1-5'  # 15:10 Beijing primary
    - cron: '20 7 * * 1-5'  # 15:20 retry
    - cron: '30 7 * * 1-5'  # 15:30 final retry
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ai-stock-daily
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Resolve target exchange session for this run
        id: marketday
        run: python -m engine.schedule_guard production
      - name: Skip redundant retry if target session already has a conditional plan
        id: guard
        shell: bash
        env:
          SETTLEMENT_DATE: ${{ steps.marketday.outputs.latest_trade_date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path

          target = os.environ['SETTLEMENT_DATE']
          fund_ids = ('D_MAIN','A','B','C','D','L')
          processed = True
          conditional = True
          for fid in fund_ids:
              path = Path('state') / f'{fid}.json'
              try:
                  state = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  processed = conditional = False
                  break
              if str(state.get('last_processed_date') or '')[:10] != target:
                  processed = False
              if str(state.get('conditional_plan_date') or '')[:10] != target:
                  conditional = False

          cache_ok = False
          cache_path = Path('state/market_universe.json')
          try:
              payload = json.loads(cache_path.read_text(encoding='utf-8'))
              asof = str(payload.get('asof') or '')[:10]
              symbols = payload.get('symbols') or []
              age = (date.fromisoformat(target) - date.fromisoformat(asof)).days
              cache_ok = 0 <= age <= 14 and len(symbols) >= 50
          except Exception:
              pass

          explicit_refresh = os.getenv('GITHUB_EVENT_NAME') == 'push'
          done = processed and conditional and cache_ok and not explicit_refresh
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'done={str(done).lower()}\n')
          print(
              f'[guard] target exchange session={target}; processed={processed}; conditional_plan={conditional}; '
              f'recovery_cache_ok={cache_ok}; explicit_refresh={explicit_refresh}; work_needed={not done}'
          )
          PY
      - name: Settle triggered entry conditions and build tomorrow conditional plans
        if: steps.guard.outputs.done != 'true' && (github.event_name != 'schedule' || steps.marketday.outputs.run == 'true')
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python -m engine.evening_split_run
      - name: Run V1 production safety gate before persistence
        if: steps.guard.outputs.done != 'true' && (github.event_name != 'schedule' || steps.marketday.outputs.run == 'true')
        shell: bash
        env:
          SETTLEMENT_DATE: ${{ steps.marketday.outputs.latest_trade_date }}
        run: |
          set -euo pipefail
          python -m engine.v1_production_gate --date "$SETTLEMENT_DATE"
      - name: Persist portfolio ledger and public snapshots
        if: steps.guard.outputs.done != 'true' && (github.event_name != 'schedule' || steps.marketday.outputs.run == 'true')
        run: |
          set -euo pipefail
          git config user.name "ai-stock-bot"
          git config user.email "ai-stock-bot@users.noreply.github.com"
          git add state/ web/d/data.json web/e/data.json
          git diff --cached --quiet || git commit -m "data: conditional-plan settlement and next plan"
          git pull --rebase origin main
          git push
      - name: Refresh latest committed web before deploy
        id: deployed_source
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assert persisted V1 settlement freshness before deploy
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
        shell: bash
        env:
          SETTLEMENT_DATE: ${{ steps.marketday.outputs.latest_trade_date }}
        run: |
          set -euo pipefail
          python -m engine.v1_freshness --date "$SETTLEMENT_DATE"
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
        with:
          path: web
      - id: deployment
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public D and E data match this deployment
        id: verify_public
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
        shell: bash
        env:
          DEPLOYED_SOURCE_SHA: ${{ steps.deployed_source.outputs.sha }}
          SETTLEMENT_DATE: ${{ steps.marketday.outputs.latest_trade_date }}
        run: |
          set -euo pipefail
          d_expected="$(sha256sum web/d/data.json | awk '{print $1}')"
          e_expected="$(sha256sum web/e/data.json | awk '{print $1}')"
          for i in $(seq 1 24); do
            ok=1
            curl -fsS --connect-timeout 5 --max-time 20 "https://ghzyzttxwd.github.io/ai-stock-lab/d/data.json?v=${GITHUB_RUN_ID}-${i}" -o /tmp/live-d.json || ok=0
            curl -fsS --connect-timeout 5 --max-time 20 "https://ghzyzttxwd.github.io/ai-stock-lab/e/data.json?v=${GITHUB_RUN_ID}-${i}" -o /tmp/live-e.json || ok=0
            if [ "$ok" = "1" ]; then
              d_actual="$(sha256sum /tmp/live-d.json | awk '{print $1}')"
              e_actual="$(sha256sum /tmp/live-e.json | awk '{print $1}')"
              echo "attempt=$i d=$d_actual e=$e_actual"
              if [ "$d_actual" = "$d_expected" ] && [ "$e_actual" = "$e_expected" ]; then
                export D_EXPECTED="$d_expected" D_ACTUAL="$d_actual" E_EXPECTED="$e_expected" E_ACTUAL="$e_actual"
                python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          expected_date=os.environ['SETTLEMENT_DATE']
          for path in ('/tmp/live-d.json','/tmp/live-e.json'):
              x=json.load(open(path,encoding='utf-8'))
              if x.get('execution_model') != 'CONDITIONAL_PLAN_V1':
                  raise SystemExit(f'public {path} is not conditional-plan model')
              actual_date=str(x.get('updated_at') or '')[:10]
              if actual_date != expected_date:
                  raise SystemExit(
                      f'public {path} is stale: updated_at={actual_date or "missing"}, expected={expected_date}'
                  )
          receipt={
              'status':'verified',
              'settlement_date':expected_date,
              'execution_model':'CONDITIONAL_PLAN_V1',
              'plan_version':'conditional-plan-v1',
              'source_commit':os.environ['DEPLOYED_SOURCE_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'd_expected_sha256':os.environ['D_EXPECTED'],
              'd_public_sha256':os.environ['D_ACTUAL'],
              'e_expected_sha256':os.environ['E_EXPECTED'],
              'e_public_sha256':os.environ['E_ACTUAL'],
              'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'public_d_url':'https://ghzyzttxwd.github.io/ai-stock-lab/d/data.json',
              'public_e_url':'https://ghzyzttxwd.github.io/ai-stock-lab/e/data.json',
          }
          open('/tmp/conditional-pages-verification.json','w',encoding='utf-8').write(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(f'PUBLIC CONDITIONAL PLAN VERIFIED settlement_date={expected_date}')
          PY
                echo "d_sha256=$d_actual" >> "$GITHUB_OUTPUT"
                echo "e_sha256=$e_actual" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public D/E data did not converge to committed fresh deployment"
          exit 1
      - name: Persist conditional-plan public verification receipt
        if: steps.guard.outputs.done == 'true' || github.event_name != 'schedule' || steps.marketday.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/conditional-pages-verification.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p state
          cp /tmp/conditional-pages-verification.json state/conditional_pages_verification.json
          git config user.name "conditional-plan-verification-bot"
          git config user.email "conditional-plan-verification-bot@users.noreply.github.com"
          git add state/conditional_pages_verification.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: verify conditional-plan public pages"
          git pull --rebase origin main
          git push origin HEAD:main
