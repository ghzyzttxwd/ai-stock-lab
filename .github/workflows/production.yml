name: Daily 15:10 virtual-fund close rebalance
on:
  workflow_dispatch:
  # Safe recovery hook: changing only this marker can start a production catch-up/read-only refresh run.
  push:
    branches: [main]
    paths:
      - 'state/.production-trigger'
  schedule:
    # Beijing time, Monday-Friday. 15:10 is the primary settlement slot; later slots are retries.
    - cron: '10 7 * * 1-5'  # 15:10 primary
    - cron: '20 7 * * 1-5'  # 15:20 retry
    - cron: '30 7 * * 1-5'  # 15:30 final retry
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ai-stock-daily
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Skip redundant retry if today already succeeded
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, date
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          fund_ids = ('D_MAIN','A','B','C','D','L')
          processed = True
          for fid in fund_ids:
              path = Path('state') / f'{fid}.json'
              try:
                  state = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  processed = False
                  break
              if str(state.get('last_processed_date') or '')[:10] != today:
                  processed = False
                  break

          cache_ok = False
          cache_path = Path('state/market_universe.json')
          try:
              payload = json.loads(cache_path.read_text(encoding='utf-8'))
              asof = str(payload.get('asof') or '')[:10]
              symbols = payload.get('symbols') or []
              age = (date.fromisoformat(today) - date.fromisoformat(asof)).days
              cache_ok = 0 <= age <= 14 and len(symbols) >= 50
          except Exception:
              pass

          # Scheduled retry slots can skip market/AI work once the ledger and cache are healthy.
          # An explicit production-trigger push intentionally rebuilds read-only web snapshots;
          # run_all sees the same processed date and does not trade or call AI again.
          explicit_refresh = os.getenv('GITHUB_EVENT_NAME') == 'push'
          done = processed and cache_ok and not explicit_refresh
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'done={str(done).lower()}\n')
          print(
              f'[guard] Beijing date={today}; processed={processed}; '
              f'recovery_cache_ok={cache_ok}; explicit_refresh={explicit_refresh}; '
              f'ledger_work_needed={not done}'
          )
          PY
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.done != 'true'
      - name: Check exchange session for scheduled run
        id: marketday
        if: steps.guard.outputs.done != 'true' && github.event_name == 'schedule'
        run: python -m engine.schedule_guard production
      - name: Settle previous target at 15:10 close rebalance, then build next decision
        if: steps.guard.outputs.done != 'true' && (github.event_name != 'schedule' || steps.marketday.outputs.run == 'true')
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python -m engine.evening_split_run
      - run: python -m unittest discover -s tests -v
        if: steps.guard.outputs.done != 'true' && (github.event_name != 'schedule' || steps.marketday.outputs.run == 'true')
      - name: Persist portfolio ledger and public snapshots
        if: steps.guard.outputs.done != 'true' && (github.event_name != 'schedule' || steps.marketday.outputs.run == 'true')
        run: |
          git config user.name "ai-stock-bot"
          git config user.email "ai-stock-bot@users.noreply.github.com"
          git add state/ web/d/data.json web/e/data.json
          git diff --cached --quiet || git commit -m "data: 15:10 close rebalance"
          git pull --rebase origin main
          git push
      - name: Refresh latest committed web before deploy
        run: |
          git fetch origin main
          git reset --hard origin/main
      # Pages deployment is still run on redundant retry slots and holidays.
      # This repairs the case where ledger persistence succeeded but a prior deploy failed.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
