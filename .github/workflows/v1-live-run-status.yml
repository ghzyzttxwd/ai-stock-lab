name: V1 live production status

on:
  push:
    branches: [main]
    paths:
      - 'state/.v1-status-trigger'

permissions:
  actions: read
  contents: write

concurrency:
  group: v1-live-production-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query latest production push run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo=os.environ['REPO']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/production.yml/runs?event=push&per_page=10'
          req=urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ai-stock-lab-v1-status',
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              data=json.load(response)
          runs=data.get('workflow_runs') or []
          if not runs:
              raise RuntimeError('No production push workflow run found')
          run=runs[0]
          payload={
              'status':run.get('status'),
              'conclusion':run.get('conclusion'),
              'run_id':run.get('id'),
              'run_number':run.get('run_number'),
              'run_attempt':run.get('run_attempt'),
              'head_sha':run.get('head_sha'),
              'event':run.get('event'),
              'created_at':run.get('created_at'),
              'updated_at':run.get('updated_at'),
              'html_url':run.get('html_url'),
              'queried_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          Path('state/v1_production_live_status.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(payload,ensure_ascii=False))
          PY

      - name: Persist status
        run: |
          set -euo pipefail
          git config user.name "v1-live-status-bot"
          git config user.email "v1-live-status-bot@users.noreply.github.com"
          git add state/v1_production_live_status.json
          git diff --cached --quiet || git commit -m "ops: persist V1 live production status"
          git pull --rebase origin main
          git push origin HEAD:main
