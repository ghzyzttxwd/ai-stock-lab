name: Conditional intraday exit scans

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/.morning-trigger'
  schedule:
    - cron: '40 1 * * 1-5'  # 09:40 Beijing
    - cron: '30 2 * * 1-5'  # 10:30 Beijing
    - cron: '20 3 * * 1-5'  # 11:20 Beijing
    - cron: '30 5 * * 1-5'  # 13:30 Beijing
    - cron: '30 6 * * 1-5'  # 14:30 Beijing
    - cron: '55 6 * * 1-5'  # 14:55 Beijing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-stock-conditional-scan
  cancel-in-progress: false

jobs:
  conditional-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Check hard-stop take-profit trailing rotation and time exits
        run: python -m engine.morning_run
      - name: Run regression tests before persistence
        run: python -m unittest discover -s tests -v
      - name: Persist conditional-exit ledger and intraday public snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-stock-bot"
          git config user.email "ai-stock-bot@users.noreply.github.com"
          git add state/ web/d/data.json web/e/data.json
          if git diff --cached --quiet; then
            echo "No conditional-scan state change."
          else
            git commit -m "data: conditional intraday exit scan"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh latest committed web before deploy
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
