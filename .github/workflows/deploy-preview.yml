name: Deploy preview website
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build safe demo preview
        env:
          FUND_STATE_DIR: /tmp/ai-stock-demo-state
        run: python -m engine.daily_run --demo
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Save regenerated preview snapshots
        run: |
          git config user.name "ai-stock-bot"
          git config user.email "ai-stock-bot@users.noreply.github.com"
          git add web/d/data.json web/e/data.json
          git diff --cached --quiet || git commit -m "chore: refresh preview data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
