name: V2 data validation (shadow only)

on:
  workflow_dispatch:
  push:
    branches: [v2-shadow]
    paths:
      - 'engine_v2/**'
      - 'tests/test_v2_shadow.py'
      - '.github/workflows/v2-data-validation.yml'

permissions:
  contents: read

concurrency:
  group: v2-data-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V2 shadow branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run V2 pure-function tests
        run: python -m unittest tests.test_v2_shadow -v

      - name: Validate live V2 data sources without touching ledgers
        run: python -m engine_v2.data_validation --output /tmp/v2-data-validation.json

      - name: Validate mixed industry sources and expose taxonomy mismatch
        run: |
          TD=$(python -c "import json; print(json.load(open('/tmp/v2-data-validation.json'))['trade_date'])")
          python -m engine_v2.industry_validation --date "$TD" --output /tmp/v2-industry-validation.json

      - name: Validate unified Shenwan L1 industry chain
        run: |
          TD=$(python -c "import json; print(json.load(open('/tmp/v2-data-validation.json'))['trade_date'])")
          python -m engine_v2.sw_industry_validation --date "$TD" --output /tmp/v2-sw-industry-validation.json

      - name: Diagnose financial report issuer overlap before quality merge
        run: |
          TD=$(python -c "import json; print(json.load(open('/tmp/v2-data-validation.json'))['trade_date'])")
          python -m engine_v2.financial_validation --date "$TD" --output /tmp/v2-financial-validation.json

      - name: Show readiness summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v2-data-validation.json',encoding='utf-8'))
          i=json.load(open('/tmp/v2-industry-validation.json',encoding='utf-8'))
          sw=json.load(open('/tmp/v2-sw-industry-validation.json',encoding='utf-8'))
          f=json.load(open('/tmp/v2-financial-validation.json',encoding='utf-8'))
          print('[V2 DATA] trade_date=',p['trade_date'])
          print('[V2 DATA] readiness=',json.dumps(p['readiness'],ensure_ascii=False))
          print('[V2 MIXED INDUSTRY] ready=',i['ready'],'taxonomy=',json.dumps(i.get('taxonomy'),ensure_ascii=False))
          print('[V2 SW INDUSTRY] ready=',sw['ready'])
          print('[V2 SW INDUSTRY] analysis=',json.dumps(sw['daily_analysis'],ensure_ascii=False))
          print('[V2 SW INDUSTRY] constituents=',json.dumps(sw['constituents'],ensure_ascii=False))
          print('[V2 FINANCIAL] ready=',f['ready_for_quality_merge'])
          print('[V2 FINANCIAL] reports=',json.dumps(f['reports'],ensure_ascii=False))
          print('[V2 FINANCIAL] overlap=',json.dumps(f['overlap'],ensure_ascii=False))
          PY

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: v2-data-validation
          path: |
            /tmp/v2-data-validation.json
            /tmp/v2-industry-validation.json
            /tmp/v2-sw-industry-validation.json
            /tmp/v2-financial-validation.json
          retention-days: 14
