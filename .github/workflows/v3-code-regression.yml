name: V3 code regression

on:
  pull_request:
    branches: [v3-agent-paper]
    paths:
      - 'engine_v3/**'
      - 'tests/test_v3*.py'
      - '.github/workflows/v3-code-regression.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run V3 unit regression only
        run: python -m unittest discover -s tests -p 'test_v3*.py' -v
