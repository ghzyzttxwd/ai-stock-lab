name: V2 shadow daily production fallback

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 1-5'   # 17:40 Beijing fallback
    - cron: '40 10 * * 1-5'  # 18:40 Beijing retry
    - cron: '40 11 * * 1-5'  # 19:40 Beijing final retry

permissions:
  contents: read
  actions: write

# This workflow is deliberately not an accounting implementation.  There is exactly one
# production settlement path: v2-evening-split.yml.  Late retries only dispatch and wait for it.
concurrency:
  group: v2-shadow-production-fallback
  cancel-in-progress: false

jobs:
  dispatch-canonical-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Dispatch canonical V2 conditional settlement
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow v2-evening-split.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          gh workflow run v2-evening-split.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          run_id=""
          for i in $(seq 1 30); do
            candidate="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow v2-evening-split.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$candidate" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo 'Canonical V2 settlement was dispatched but its workflow run could not be located.'
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "canonical_v2_run_id=$run_id"

      - name: Require canonical settlement terminal success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "Canonical V2 settlement completed successfully: $RUN_ID"

      - name: Assert fallback contains no accounting implementation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Fallback is dispatcher-only; all accounting and terminal verification live in v2-evening-split.yml.'
