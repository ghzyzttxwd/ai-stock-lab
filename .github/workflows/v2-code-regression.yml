name: Verify V2 conditional-exit code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/.v2-code-ci-trigger'

permissions:
  contents: write

concurrency:
  group: v2-code-regression
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout V2 shadow code
        uses: actions/checkout@v4
        with:
          ref: v2-shadow
          path: v2
          fetch-depth: 1
      - name: Checkout main workflow definitions
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/requirements.txt
      - run: pip install -r v2/requirements.txt
      - name: Run all V2 regression tests
        working-directory: v2
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
      - name: Count discovered V2 regression tests
        id: tests
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          count=$(python - <<'PY'
          import unittest
          print(unittest.defaultTestLoader.discover('tests', pattern='test_v2*.py').countTestCases())
          PY
          )
          echo "test_count=$count" >> "$GITHUB_OUTPUT"
          test "$count" -ge 63
      - name: Assert checkpoint freshness, atomic settlement, audit ordering and fail-closed recovery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          morning = Path('main/.github/workflows/v2-morning-sell.yml').read_text(encoding='utf-8')
          guard = Path('main/.github/workflows/v2-checkpoint-guard.yml').read_text(encoding='utf-8')
          settlement = Path('main/.github/workflows/v2-evening-split.yml').read_text(encoding='utf-8')
          fallback = Path('main/.github/workflows/v2-shadow-production.yml').read_text(encoding='utf-8')
          runner = Path('v2/engine_v2/morning_sell_run.py').read_text(encoding='utf-8')
          catchup = Path('v2/engine_v2/execution_catchup.py').read_text(encoding='utf-8')
          reporting = Path('v2/engine_v2/shadow_reporting.py').read_text(encoding='utf-8')
          ordering_test = Path('v2/tests/test_v2_audit_order.py')
          timing_test = Path('v2/tests/test_v2_checkpoint_timing.py').read_text(encoding='utf-8')
          catchup_test = Path('v2/tests/test_v2_execution_catchup.py').read_text(encoding='utf-8')

          expected = (
              "'40 1 * * 1-5'", "'30 2 * * 1-5'", "'20 3 * * 1-5'",
              "'30 5 * * 1-5'", "'30 6 * * 1-5'", "'55 6 * * 1-5'",
          )
          missing = [x for x in expected if x not in morning]
          if missing:
              raise SystemExit(f'missing V2 checkpoints: {missing}')
          for obsolete in ("'50 1 * * 1-5'", "'0 2 * * 1-5'"):
              if obsolete in morning:
                  raise SystemExit(f'obsolete retry cron still wired: {obsolete}')
          if 'cancel-in-progress: false' not in morning:
              raise SystemExit('V2 checkpoints may still cancel an in-flight run')
          if '--scheduled-time' not in morning:
              raise SystemExit('V2 workflow does not pass logical checkpoint to runner')

          if 'stale_checkpoint_skipped' not in runner:
              raise SystemExit('runner no longer exposes stale checkpoint status')
          if 'late_duplicate_noop' not in runner:
              raise SystemExit('runner does not classify late duplicate checkpoints')
          if 'MAX_CHECKPOINT_LATENESS_MINUTES = 10' not in runner:
              raise SystemExit('10-minute freshness limit missing from V2 runner')
          if "'reads_market_quotes': False" not in runner or "'mutates_v2_ledger': False" not in runner:
              raise SystemExit('stale/late duplicate V2 run is not proven fail-closed')
          if 'test_late_duplicate_is_noop_and_never_claims_fresh_evaluation' not in timing_test:
              raise SystemExit('late duplicate regression test is missing')
          if 'late_duplicate_noop' not in morning:
              raise SystemExit('canonical checkpoint workflow does not understand late duplicate no-op')
          if "evaluated_fresh=checkpoint_status=='conditional_exit_processed'" not in morning:
              raise SystemExit('canonical status can still label duplicate work as freshly evaluated')
          if '[MONOTONIC RECEIPT]' not in morning:
              raise SystemExit('canonical receipt can still roll back to an older checkpoint')
          if '[MONOTONIC STATUS]' not in morning:
              raise SystemExit('canonical status can still roll back to an older checkpoint')
          if 'v2_morning_last_attempt.json' not in morning:
              raise SystemExit('late attempts are not preserved separately from monotonic checkpoint status')

          if '_ordered_audit_events' not in reporting:
              raise SystemExit('V2 audit verification still relies on filename ordering')
          if not ordering_test.exists():
              raise SystemExit('V2 audit parent-link ordering regression test is missing')

          canonical_core = 'Persist V2 audit and ledger core before derived reporting'
          guard_core = 'Persist V2 audit and ledger core before derived reporting'
          if canonical_core not in morning or morning.index(canonical_core) > morning.index('Build intraday V2 summary'):
              raise SystemExit('canonical checkpoint workflow does not persist core before derived reporting')
          if guard_core not in guard or guard.index(guard_core) > guard.index('Build intraday V2 summary'):
              raise SystemExit('guard workflow does not persist core before derived reporting')
          for text, label in ((morning, 'canonical checkpoint'), (guard, 'guard')):
              for marker in ('checkpoint_durable', 'end_to_end_verified'):
                  if marker not in text:
                      raise SystemExit(f'{label} workflow status lacks {marker}')

          # The 15:10 settlement is the only accounting implementation after conditional migration.
          if 'group: v2-daily-settlement' not in settlement or 'cancel-in-progress: false' not in settlement:
              raise SystemExit('V2 15:10 settlement is not serialized fail-safe')
          if 'engine_v2.shadow_run_split' not in settlement:
              raise SystemExit('V2 15:10 settlement is not using conditional split accounting')
          if 'engine_v2.execution_catchup' in settlement or 'python -m engine_v2.shadow_run \\' in settlement:
              raise SystemExit('legacy V2 accounting survived in canonical settlement')
          if 'continue-on-error: true' in settlement:
              raise SystemExit('canonical V2 settlement can still hide a failed critical step')
          for marker in (
              'Require complete daily conditional state before persistence',
              'last_processed_date', 'last_execution_date', 'next-session plan is missing',
              'Verify public V2 data equals conditional-plan result', 'daily_complete',
          ):
              if marker not in settlement:
                  raise SystemExit(f'canonical V2 terminal contract missing: {marker}')
          if "v2-shadow-summary-1.2" not in settlement:
              raise SystemExit('canonical V2 settlement validates an obsolete web schema')

          # Late production retries must dispatch the canonical workflow, never mutate ledgers themselves.
          if 'v2-evening-split.yml' not in fallback or 'gh run watch' not in fallback or '--exit-status' not in fallback:
              raise SystemExit('V2 fallback does not dispatch and require canonical terminal success')
          forbidden_fallback = (
              'engine_v2.execution_catchup', 'engine_v2.shadow_run', 'engine_v2.shadow_run_split',
              'shadow_state/v2/ledgers', 'continue-on-error: true',
          )
          survived = [x for x in forbidden_fallback if x in fallback]
          if survived:
              raise SystemExit(f'fallback still contains accounting/masked-failure logic: {survived}')
          if 'cancel-in-progress: false' not in fallback:
              raise SystemExit('fallback dispatch can cancel an in-flight retry')

          # Keep the old module only for pre-conditional historical compatibility, fail closed otherwise.
          if 'legacy V2 execution catch-up is forbidden for conditional-plan state' not in catchup:
              raise SystemExit('legacy catch-up is not fail-closed for conditional V2')
          if '_uses_conditional_execution' not in catchup or 'pending_is_conditional' not in catchup:
              raise SystemExit('legacy catch-up does not recognize conditional ledgers/plans')
          if 'test_conditional_state_refuses_legacy_catchup_before_market_call_or_mutation' not in catchup_test:
              raise SystemExit('conditional catch-up regression test is missing')

          print('V2 CHECKPOINT + ATOMIC SETTLEMENT + FAIL-CLOSED RECOVERY CONTRACT PASS')
          PY
      - name: Verify current V2 audit and ledger chain
        id: audit
        working-directory: v2
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from engine_v2.shadow_reporting import verify_audit_chain
          result = verify_audit_chain(Path('shadow_state/v2'))
          print(f"status={result['status']}")
          print(f"head={result['head']}")
          print(f"events={result['events']}")
          print(f"last_date={result['last_date']}")
          PY
      - name: Persist verification receipt to main
        run: |
          set -euo pipefail
          cd main
          actual_v2_sha="$(git -C ../v2 rev-parse HEAD)"
          export ACTUAL_V2_SHA="$actual_v2_sha"
          export TEST_COUNT="${{ steps.tests.outputs.test_count }}"
          export AUDIT_STATUS="${{ steps.audit.outputs.status }}"
          export AUDIT_HEAD="${{ steps.audit.outputs.head }}"
          export AUDIT_EVENTS="${{ steps.audit.outputs.events }}"
          export AUDIT_LAST_DATE="${{ steps.audit.outputs.last_date }}"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt = {
              'status': 'verified',
              'v2_source_commit': os.environ['ACTUAL_V2_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'tests': "python -m unittest discover -s tests -p 'test_v2*.py' -v",
              'test_count': int(os.environ['TEST_COUNT']),
              'checkpoints': ['09:40','10:30','11:20','13:30','14:30','14:55'],
              'max_checkpoint_lateness_minutes': 10,
              'obsolete_0950_retry_removed': True,
              'obsolete_1000_retry_removed': True,
              'cancel_in_progress': False,
              'stale_run_reads_market_quotes': False,
              'stale_run_mutates_v2_ledger': False,
              'stale_checkpoint_is_workflow_failure': True,
              'late_duplicate_noop_protected': True,
              'late_duplicate_reads_market_quotes': False,
              'late_duplicate_mutates_v2_ledger': False,
              'checkpoint_status_is_monotonic': True,
              'checkpoint_receipt_is_monotonic': True,
              'late_attempt_recorded_separately': True,
              'audit_parent_link_ordering': True,
              'core_persisted_before_derived_reporting': True,
              'status_distinguishes_durable_and_end_to_end': True,
              'conditional_catchup_fail_closed': True,
              'single_settlement_implementation': True,
              'settlement_requires_complete_daily_state': True,
              'fallback_dispatch_only': True,
              'audit_chain_status': os.environ['AUDIT_STATUS'],
              'audit_head': os.environ['AUDIT_HEAD'],
              'audit_events': int(os.environ['AUDIT_EVENTS']),
              'audit_last_event': os.environ['AUDIT_LAST_DATE'],
              'trailing_uses_intraday_high': True,
              'max_hold_1455_reachable': True,
              'verified_at_utc': datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          os.makedirs('state', exist_ok=True)
          open('state/v2_code_regression_verification.json','w',encoding='utf-8').write(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n'
          )
          PY
          git config user.name "v2-code-ci-bot"
          git config user.email "v2-code-ci-bot@users.noreply.github.com"
          git add state/v2_code_regression_verification.json
          if git diff --cached --quiet; then
            echo 'V2 verification receipt unchanged.'
            exit 0
          fi
          git commit -m 'ops: persist V2 code regression verification'
          git pull --rebase origin main
          git push origin HEAD:main
