name: V2 Pages deploy controller

on:
  pull_request:
    branches: [main]
    paths:
      - 'state/.v2-pages-deploy-probe-trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch and monitor canonical Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:web/v2/data.json > /tmp/expected-v2.json
          EXPECTED="$(sha256sum /tmp/expected-v2.json | awk '{print $1}')"
          echo "EXPECTED_V2_SHA256=$EXPECTED"

          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          code=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/auto-deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch.txt || true
          echo "DISPATCH_HTTP_CODE=$code BEFORE=$before"
          test "$code" = "204"

          RUN_ID=''
          for i in $(seq 1 12); do
            sleep 3
            RUN_ID="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
          done
          test -n "$RUN_ID"
          echo "AUTO_DEPLOY_RUN_ID=$RUN_ID"

          for i in $(seq 1 90); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            echo "AUTO_DEPLOY_POLL=$i STATUS=$status CONCLUSION=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "AUTO_DEPLOY_FAILED run=$RUN_ID conclusion=$conclusion"
                gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
              fi
              echo "AUTO_DEPLOY_SUCCESS run=$RUN_ID"
              break
            fi
            sleep 5
            if [ "$i" = "90" ]; then echo 'auto-deploy timed out' >&2; exit 1; fi
          done

          for i in $(seq 1 24); do
            if curl -fsS --connect-timeout 5 --max-time 20 \
              "https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json?controller=${GITHUB_RUN_ID}-${i}" \
              -o /tmp/live-v2.json; then
              ACTUAL="$(sha256sum /tmp/live-v2.json | awk '{print $1}')"
              echo "PUBLIC_POLL=$i EXPECTED=$EXPECTED ACTUAL=$ACTUAL"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "PAGES_DEPLOY_CONTROLLER_PASS AUTO_DEPLOY_RUN_ID=$RUN_ID EXPECTED_SHA256=$EXPECTED PUBLIC_SHA256=$ACTUAL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "AUTO_DEPLOY_SUCCEEDED_BUT_PUBLIC_HASH_STALE expected=$EXPECTED" >&2
          exit 1
