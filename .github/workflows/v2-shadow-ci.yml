name: V2 shadow code regression

on:
  push:
    branches: [v2-shadow]
    paths:
      - 'engine_v2/**'
      - 'tests/test_v2*.py'
      - '.github/workflows/v2-shadow-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run all V2 regression tests
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
