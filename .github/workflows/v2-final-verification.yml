name: Final V2 stale-checkpoint verification
# trigger: 2026-08-20 11:18 Asia/Shanghai

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-final-verification.yml'

permissions:
  contents: write

concurrency:
  group: v2-final-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V2 shadow
        uses: actions/checkout@v4
        with:
          ref: v2-shadow
          path: v2
          fetch-depth: 1
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/requirements.txt
      - name: Install dependencies
        run: pip install -r v2/requirements.txt
      - name: Run all V2 regression tests
        working-directory: v2
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
      - name: Verify final stale-checkpoint semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow=Path('main/.github/workflows/v2-morning-sell.yml').read_text(encoding='utf-8')
          runner=Path('v2/engine_v2/morning_sell_run.py').read_text(encoding='utf-8')
          timing=Path('v2/tests/test_v2_checkpoint_timing.py').read_text(encoding='utf-8')
          checkpoints=("'40 1 * * 1-5'","'30 2 * * 1-5'","'20 3 * * 1-5'","'30 5 * * 1-5'","'30 6 * * 1-5'","'55 6 * * 1-5'")
          missing=[x for x in checkpoints if x not in workflow]
          if missing: raise SystemExit(f'missing checkpoints: {missing}')
          for obsolete in ("'50 1 * * 1-5'","'0 2 * * 1-5'"):
              if obsolete in workflow: raise SystemExit(f'obsolete retry remains: {obsolete}')
          required=(
              'MAX_CHECKPOINT_LATENESS_MINUTES = 10',
              "'status': 'stale_checkpoint_skipped'",
              "'reads_market_quotes': False",
              "'mutates_v2_ledger': False",
              "fill['scheduled_time'] = scheduled_time",
              "fill['actual_execution_time'] = executed_at",
          )
          missing=[x for x in required if x not in runner]
          if missing: raise SystemExit(f'missing runner safety semantics: {missing}')
          if 'test_checkpoint_over_ten_minutes_is_stale' not in timing:
              raise SystemExit('stale timing regression test missing')
          if 'cancel-in-progress: false' not in workflow:
              raise SystemExit('checkpoint runs can still cancel each other')
          print('FINAL V2 STALE-CHECKPOINT SEMANTICS PASS')
          PY
      - name: Persist final V2 verification receipt
        shell: bash
        run: |
          set -euo pipefail
          v2_sha="$(git -C v2 rev-parse HEAD)"
          export V2_SHA="$v2_sha"
          cd main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
              'status':'verified',
              'v2_source_commit':os.environ['V2_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'tests':"python -m unittest discover -s tests -p 'test_v2*.py' -v",
              'checkpoints':['09:40','10:30','11:20','13:30','14:30','14:55'],
              'max_checkpoint_lateness_minutes':10,
              'obsolete_0950_retry_removed':True,
              'obsolete_1000_retry_removed':True,
              'cancel_in_progress':False,
              'stale_run_reads_market_quotes':False,
              'stale_run_mutates_v2_ledger':False,
              'records_scheduled_and_actual_execution_time':True,
              'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          open('state/v2_final_verification.json','w',encoding='utf-8').write(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'v2-final-ci-bot'
          git config user.email 'v2-final-ci-bot@users.noreply.github.com'
          git add state/v2_final_verification.json
          git commit -m 'ops: persist final V2 stale-checkpoint verification'
          git pull --rebase origin main
          git push origin HEAD:main
