name: Tencent full-market smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Verify Tencent full-market quote endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json, signal, time
          import akshare as ak

          def alarm(_sig,_frame):
              raise TimeoutError('Tencent full-market call exceeded 90s')
          signal.signal(signal.SIGALRM,alarm)
          signal.alarm(90)
          t0=time.time()
          try:
              df=ak.stock_zh_a_spot_tx()
          finally:
              signal.alarm(0)
          if df is None or df.empty:
              raise SystemExit('Tencent full-market returned empty dataframe')
          print('[tx-full] columns=',list(df.columns))
          print('[tx-full] rows=',len(df),'elapsed=',round(time.time()-t0,2))
          print(df.head(3).to_json(force_ascii=False,orient='records'))

          code_col=next((c for c in df.columns if str(c).lower() in ('代码','code','symbol','证券代码')),None)
          if code_col is None:
              for c in df.columns:
                  vals=df[c].astype(str).head(200)
                  if vals.str.contains(r'^(sh|sz|bj)?\.?\d{6}$',regex=True).mean() > 0.5:
                      code_col=c; break
          if code_col is None:
              raise SystemExit(f'cannot identify Tencent code column from {list(df.columns)}')

          def norm(x):
              s=str(x).lower().strip().replace('.','')
              if s.startswith(('sh','sz','bj')):
                  return s
              digits=''.join(ch for ch in s if ch.isdigit())[-6:]
              if len(digits)!=6: return ''
              if digits.startswith(('600','601','603','605','688')): return 'sh'+digits
              if digits.startswith(('000','001','002','003','300','301')): return 'sz'+digits
              if digits.startswith(('4','8','9')): return 'bj'+digits
              return digits

          codes=[norm(x) for x in df[code_col].tolist()]
          main=[c for c in codes if c.startswith(('sh600','sh601','sh603','sh605','sz000','sz001','sz002','sz003'))]
          unique_main=len(set(main))
          report={'rows':len(df),'unique_main_board':unique_main,'elapsed_sec':round(time.time()-t0,2),'code_col':str(code_col)}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if unique_main < 2500:
              raise SystemExit(f'Tencent full-market main-board coverage suspiciously low: {unique_main}')
          PY
