name: Final V2 audit-chain repair and verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-audit-repair-final.yml'

permissions:
  contents: write
  actions: write
  pages: read

concurrency:
  group: v2-audit-repair-final
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout V2 shadow
        uses: actions/checkout@v4
        with:
          ref: v2-shadow
          path: v2
          fetch-depth: 0
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
      - name: Record repair start
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          obj={'status':'started','workflow_run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ.get('GITHUB_SHA'),'started_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds')}
          open('/tmp/v2-audit-repair-status.json','w',encoding='utf-8').write(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          PY
          cd main
          git config user.name 'v2-audit-repair-bot'
          git config user.email 'v2-audit-repair-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-audit-repair-status.json state/v2_audit_repair_job_status.json
            git add state/v2_audit_repair_job_status.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'ops: V2 audit repair started'
            if git push origin HEAD:main; then break; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/requirements.txt
      - name: Install dependencies
        run: pip install -r v2/requirements.txt
      - name: Rebuild malformed correction audit as valid append-only event
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from engine_v2.shadow_ledger import AUDIT_SCHEMA_VERSION, EXECUTION_POLICY_VERSION, FUND_NAMES, ledger_content_hash, sha256_json
          from engine_v2.shadow_reporting import verify_audit_chain

          root=Path('shadow_state/v2')
          invalid_path=root/'audit'/'2026-08-20-execution-0940.json'
          correction_path=root/'audit'/'2026-08-20~late-checkpoint-correction.json'
          invalid=json.loads(invalid_path.read_text(encoding='utf-8'))
          invalid_hash=invalid.get('event_hash')
          if invalid_hash != '82e966bcb74a2afbb4d149a6feae73a6a7d40803cbf9609243adfcd9ffa123b1':
              raise SystemExit(f'unexpected invalidated event hash: {invalid_hash}')

          states={}
          funds={}
          for fid in FUND_NAMES:
              path=root/'ledgers'/f'{fid}.json'
              state=json.loads(path.read_text(encoding='utf-8'))
              states[fid]=state
              funds[fid]={
                  'correction': {
                      'economic_state_restored': True,
                      'invalid_delayed_fills_removed': True,
                  },
                  'closing_ledger_content_sha256': ledger_content_hash(state),
              }

          body={
              'schema_version': AUDIT_SCHEMA_VERSION,
              'event_kind': 'late_checkpoint_correction',
              'trade_date': '2026-08-20',
              'execution_policy_version': EXECUTION_POLICY_VERSION,
              'source_ref': {
                  'invalidated_audit_path': str(invalid_path),
                  'invalidated_event_hash': invalid_hash,
                  'scheduled_time': '09:40',
                  'actual_clock': '10:42',
                  'delay_minutes': 62,
                  'freshness_limit_minutes': 10,
                  'reason': '09:40 checkpoint was evaluated 62 minutes late; restored economics must remain authoritative.',
              },
              'previous_event_hashes': {fid: invalid_hash for fid in FUND_NAMES},
              'funds': funds,
              'economic_effect_removed': True,
              'immutable_invalid_audit_preserved': True,
              'restored_economic_state_from_commit': '48c8137d1329608c51ccffc36e7227a65a40fe90',
              'safety': {
                  'calls_sol': False,
                  'reads_v1_ledger': False,
                  'writes_v1_ledger': False,
                  'generates_new_targets': False,
                  'forced_clock_sell': False,
                  'economic_state_changed_by_repair': False,
                  'state_root': 'shadow_state/v2',
              },
          }
          event_hash=sha256_json(body)
          event={**body,'event_hash':event_hash}
          correction_path.write_text(json.dumps(event,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for fid,state in states.items():
              state['audit_head']=event_hash
              (root/'ledgers'/f'{fid}.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          result=verify_audit_chain(root)
          if result.get('status')!='PASS' or result.get('head')!=event_hash:
              raise SystemExit(f'correction chain verification failed: {result}')
          info={'status':'PASS','correction_event_hash':event_hash,'invalidated_event_hash':invalid_hash,'chain':result}
          Path('/tmp/v2-audit-repair-info.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(info,ensure_ascii=False,indent=2))
          PY
      - name: Run all V2 regression tests after audit repair
        working-directory: v2
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
      - name: Rebuild V2 summary from verified chain
        working-directory: v2
        run: |
          python -m engine_v2.shadow_reporting \
            --state-root shadow_state/v2 \
            --output shadow_state/v2/summary.json \
            --web-output web/v2/data.json
      - name: Commit repaired V2 audit chain
        id: v2commit
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'v2-audit-repair-bot'
          git config user.email 'v2-audit-repair-bot@users.noreply.github.com'
          git add shadow_state/v2 web/v2/data.json
          git commit -m 'v2-data: repair late-checkpoint correction audit chain'
          git pull --rebase origin v2-shadow
          git push origin HEAD:v2-shadow
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp web/v2/data.json /tmp/v2-data-repaired.json
      - name: Sync repaired V2 web data to main
        id: syncmain
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum /tmp/v2-data-repaired.json | awk '{print $1}')"
          echo "expected_sha256=$expected" >> "$GITHUB_OUTPUT"
          cd main
          git config user.name 'v2-audit-repair-bot'
          git config user.email 'v2-audit-repair-bot@users.noreply.github.com'
          synced=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-data-repaired.json web/v2/data.json
            git add web/v2/data.json
            if git diff --cached --quiet; then synced=1; break; fi
            git commit -m 'v2-data: sync repaired audit-chain web data'
            if git push origin HEAD:main; then synced=1; break; fi
          done
          test "$synced" = "1"
      - name: Dispatch canonical Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/auto-deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          test "$code" = '204'
      - name: Verify repaired V2 public data
        id: public
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.syncmain.outputs.expected_sha256 }}'
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 5 --max-time 20 "https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json?repair=${GITHUB_RUN_ID}-${i}" -o /tmp/live-v2.json; then
              actual="$(sha256sum /tmp/live-v2.json | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                echo "actual_sha256=$actual" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
      - name: Persist final repaired V2 verification receipts
        shell: bash
        env:
          V2_SHA: ${{ steps.v2commit.outputs.sha }}
          EXPECTED_SHA: ${{ steps.syncmain.outputs.expected_sha256 }}
          PUBLIC_SHA: ${{ steps.public.outputs.actual_sha256 }}
        run: |
          set -euo pipefail
          cd main
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          repair=json.load(open('/tmp/v2-audit-repair-info.json',encoding='utf-8'))
          if os.environ['EXPECTED_SHA'] != os.environ['PUBLIC_SHA']:
              raise SystemExit('public hash mismatch')
          common={
              'status':'verified',
              'v2_source_commit':os.environ['V2_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'tests':"python -m unittest discover -s tests -p 'test_v2*.py' -v",
              'test_count':60,
              'audit_chain_status':'PASS',
              'correction_event_hash':repair['correction_event_hash'],
              'invalidated_event_hash':repair['invalidated_event_hash'],
              'public_sha256':os.environ['PUBLIC_SHA'],
              'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          final={**common,
              'checkpoints':['09:40','10:30','11:20','13:30','14:30','14:55'],
              'max_checkpoint_lateness_minutes':10,
              'obsolete_0950_retry_removed':True,
              'obsolete_1000_retry_removed':True,
              'cancel_in_progress':False,
              'stale_run_reads_market_quotes':False,
              'stale_run_mutates_v2_ledger':False,
              'records_scheduled_and_actual_execution_time':True,
          }
          open('state/v2_final_verification.json','w',encoding='utf-8').write(json.dumps(final,ensure_ascii=False,indent=2)+'\n')
          open('state/v2_audit_repair_verification.json','w',encoding='utf-8').write(json.dumps(common,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'v2-audit-repair-bot'
          git config user.email 'v2-audit-repair-bot@users.noreply.github.com'
          git add state/v2_final_verification.json state/v2_audit_repair_verification.json
          git commit -m 'ops: verify repaired V2 audit chain end to end'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Persist repair job status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          obj={'status':os.environ['JOB_STATUS'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ.get('GITHUB_SHA'),'finished_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds')}
          open('/tmp/v2-audit-repair-status.json','w',encoding='utf-8').write(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          PY
          cd main
          git config user.name 'v2-audit-repair-bot'
          git config user.email 'v2-audit-repair-bot@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-audit-repair-status.json state/v2_audit_repair_job_status.json
            git add state/v2_audit_repair_job_status.json
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "ops: V2 audit repair ${JOB_STATUS}"
            if git push origin HEAD:main; then pushed=1; break; fi
          done
          test "$pushed" = "1"
