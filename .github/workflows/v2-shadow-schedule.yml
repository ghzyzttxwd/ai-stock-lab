name: Schedule V2 shadow ledger

on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 1-5'  # 18:35 Beijing primary
    - cron: '5 11 * * 1-5'   # 19:05 Beijing retry

permissions:
  contents: write

concurrency:
  group: v2-shadow-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-shadow
          fetch-depth: 0
      - name: Touch isolated V2 run trigger
        shell: bash
        run: |
          printf 'scheduled-%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > shadow_state/v2/.run-trigger
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add shadow_state/v2/.run-trigger
          git commit -m "v2: scheduled shadow run trigger"
          git pull --rebase origin v2-shadow
          git push origin HEAD:v2-shadow
