name: Sync V2 Pages fallback

on:
  push:
    branches:
      - v2-shadow
    paths:
      - 'web/v2/data.json'
      - '.github/workflows/v2-sync-pages-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v2-sync-pages-fallback
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V2 shadow branch
        uses: actions/checkout@v4
        with:
          ref: v2-shadow
          fetch-depth: 0

      - name: Validate V2 source and freeze expected snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('web/v2/data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('summary_version') == 'v2-shadow-summary-1.1'
          assert data.get('mode') == 'FORWARD_SHADOW_ONLY'
          assert set(data.get('funds', {})) == {'A', 'B', 'C', 'D', 'L'}
          print('updated_at=', data.get('updated_at'))
          for fund_id in 'ABCDL':
              metrics = data['funds'][fund_id].get('metrics', {})
              print(fund_id, 'equity=', metrics.get('equity'), 'return_pct=', metrics.get('return_pct'), 'positions=', metrics.get('positions'))
          PY
          cp web/v2/data.json /tmp/v2-data.json
          sha256sum /tmp/v2-data.json

      - name: Sync exact V2 snapshot into main
        id: sync_main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/v2-data.json web/v2/data.json
          cmp /tmp/v2-data.json web/v2/data.json
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add web/v2/data.json
          if git diff --cached --quiet; then
            echo "Pages copy already matches V2 shadow data."
          else
            git commit -m "v2-data: sync Pages fallback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          main_sha="$(git rev-parse HEAD)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha"

      - name: Dispatch official Pages deploy and wait for terminal result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.sync_main.outputs.main_sha }}
        run: |
          set -euo pipefail
          echo "Waiting for verified Pages deployment of main_sha=$MAIN_SHA"
          gh workflow run auto-deploy.yml --ref main

          run_id=""
          for i in $(seq 1 30); do
            run_id="$(gh run list --workflow auto-deploy.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,status --jq ".[] | select(.headSha == \"$MAIN_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "Could not locate the Pages workflow run for main_sha=$MAIN_SHA"
            exit 1
          fi

          echo "pages_run_id=$run_id"
          gh run watch "$run_id" --exit-status
          echo "Verified Pages workflow completed successfully."
