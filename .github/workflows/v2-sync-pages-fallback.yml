name: Sync V2 Pages fallback

on:
  push:
    branches:
      - v2-shadow
    paths:
      - 'web/v2/data.json'
      - '.github/workflows/v2-sync-pages-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v2-sync-pages-fallback
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V2 shadow branch
        uses: actions/checkout@v4
        with:
          ref: v2-shadow
          fetch-depth: 0

      - name: Validate V2 source and freeze expected snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('web/v2/data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('summary_version') == 'v2-shadow-summary-1.2'
          assert data.get('mode') == 'FORWARD_SHADOW_ONLY'
          assert set(data.get('funds', {})) == {'A', 'B', 'C', 'D', 'L'}
          print('updated_at=', data.get('updated_at'))
          for fund_id in 'ABCDL':
              metrics = data['funds'][fund_id].get('metrics', {})
              print(fund_id, 'equity=', metrics.get('equity'), 'return_pct=', metrics.get('return_pct'), 'positions=', metrics.get('positions'))
          PY
          cp web/v2/data.json /tmp/v2-data.json
          sha256sum /tmp/v2-data.json

      - name: Sync exact V2 snapshot into main
        id: sync_main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/v2-data.json web/v2/data.json
          cmp /tmp/v2-data.json web/v2/data.json
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add web/v2/data.json
          if git diff --cached --quiet; then
            echo "Pages copy already matches V2 shadow data."
          else
            git commit -m "v2-data: sync Pages fallback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          main_sha="$(git rev-parse HEAD)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha"

      - name: Dispatch official Pages deploy and require terminal verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.sync_main.outputs.main_sha }}
        run: |
          set -euo pipefail
          echo "Requiring verified Pages deployment of main_sha=$MAIN_SHA"

          for deploy_attempt in 1 2 3; do
            echo "Pages deployment attempt $deploy_attempt/3"
            dispatch_url="$(gh workflow run auto-deploy.yml --ref main)"
            echo "dispatch_url=$dispatch_url"
            run_id="${dispatch_url##*/}"

            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Could not parse exact Pages run id from dispatch URL: $dispatch_url"
            else
              echo "exact_pages_run_id=$run_id"
              if gh run watch "$run_id" --exit-status; then
                echo "Exact dispatched Pages workflow $run_id completed successfully on attempt $deploy_attempt."
                exit 0
              fi
              echo "Exact dispatched Pages workflow $run_id failed on attempt $deploy_attempt."
            fi

            if [ "$deploy_attempt" -lt 3 ]; then
              echo "Waiting 25s before retrying transient GitHub Pages failure."
              sleep 25
            fi
          done

          echo "All 3 exact verified Pages deployment attempts failed."
          exit 1
