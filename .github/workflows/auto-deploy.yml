name: 自动测试并发布网页

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'web/d/data.json'
      - 'web/e/data.json'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-auto-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 读取最新代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行自动测试
        run: python -m unittest discover -s tests -v

      - name: 发布前同步最新基金数据
        run: |
          git fetch origin main
          git checkout origin/main -- web/d/data.json web/e/data.json

      - name: 准备 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 公网验收 V2 数据与本次发布完全一致
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum web/v2/data.json | awk '{print $1}')"
          echo "expected_sha256=$expected"
          for i in $(seq 1 12); do
            url="https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json?verify=${GITHUB_SHA}-${i}"
            if curl -fsS --connect-timeout 5 --max-time 20 "$url" -o /tmp/live-v2-data.json; then
              actual="$(sha256sum /tmp/live-v2-data.json | awk '{print $1}')"
              echo "attempt=$i actual_sha256=$actual"
              if [ "$actual" = "$expected" ]; then
                python - <<'PY'
          import json
          live=json.load(open('/tmp/live-v2-data.json', encoding='utf-8'))
          print('LIVE VERIFIED updated_at=', live.get('updated_at'))
          for fund_id in 'ABCDL':
              m=live['funds'][fund_id]['metrics']
              print(fund_id, 'return_pct=', m.get('return_pct'), 'equity=', m.get('equity'), 'positions=', m.get('positions'))
          PY
                exit 0
              fi
            fi
            sleep 5
          done
          echo "公网 V2 数据与本次发布文件不一致，禁止把本次部署判定为成功。"
          exit 1
