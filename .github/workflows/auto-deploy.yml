name: 自动测试并发布网页

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'web/d/data.json'
      - 'web/e/data.json'
      - 'shadow_state/v2/.morning-trigger'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-auto-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 读取最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行自动测试
        run: python -m unittest discover -s tests -v

      - name: 发布前同步最新基金数据
        run: |
          git fetch origin main
          git checkout origin/main -- web/d/data.json web/e/data.json

      - name: 准备 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 公网验收 V2 数据与本次发布完全一致
        id: verify_v2
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum web/v2/data.json | awk '{print $1}')"
          export EXPECTED_SHA256="$expected"
          echo "expected_sha256=$expected"
          for i in $(seq 1 18); do
            url="https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${i}"
            if curl -fsS --connect-timeout 5 --max-time 20 "$url" -o /tmp/live-v2-data.json; then
              actual="$(sha256sum /tmp/live-v2-data.json | awk '{print $1}')"
              echo "attempt=$i actual_sha256=$actual"
              if [ "$actual" = "$expected" ]; then
                python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          live_path = '/tmp/live-v2-data.json'
          live = json.load(open(live_path, encoding='utf-8'))
          raw = open(live_path, 'rb').read()
          actual = hashlib.sha256(raw).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if actual != expected:
              raise SystemExit('verification receipt hash mismatch')
          print('LIVE VERIFIED updated_at=', live.get('updated_at'))
          for fund_id in 'ABCDL':
              m=live['funds'][fund_id]['metrics']
              print(fund_id, 'return_pct=', m.get('return_pct'), 'equity=', m.get('equity'), 'positions=', m.get('positions'))
          receipt = {
              'status': 'verified',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'expected_sha256': expected,
              'public_sha256': actual,
              'updated_at': live.get('updated_at'),
              'verified_at_utc': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'public_url': 'https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json',
          }
          open('/tmp/v2-pages-verification.json', 'w', encoding='utf-8').write(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n'
          )
          PY
                echo "expected_sha256=$expected" >> "$GITHUB_OUTPUT"
                echo "actual_sha256=$actual" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "公网 V2 数据与本次发布文件不一致，禁止把本次部署判定为成功。"
          exit 1

      - name: 持久化公网验收回执
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/v2-pages-verification.json
          mkdir -p state
          cp /tmp/v2-pages-verification.json state/v2_pages_verification.json
          git config user.name "pages-verification-bot"
          git config user.email "pages-verification-bot@users.noreply.github.com"
          git add state/v2_pages_verification.json
          if git diff --cached --quiet; then
            echo "Verification receipt unchanged."
            exit 0
          fi
          git commit -m "ops: persist V2 Pages verification receipt"
          git pull --rebase origin main
          git push origin HEAD:main
