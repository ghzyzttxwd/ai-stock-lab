name: 自动测试并发布网页

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'web/d/data.json'
      - 'web/e/data.json'
      - 'shadow_state/v2/.morning-trigger'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-auto-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 读取最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 锁定 main 最新提交
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行自动测试
        run: python -m unittest discover -s tests -v

      - name: 发布前断言三套网页均为条件计划模型
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path('web/d/data.json').read_text(encoding='utf-8'))
          e=json.loads(Path('web/e/data.json').read_text(encoding='utf-8'))
          v2=json.loads(Path('web/v2/data.json').read_text(encoding='utf-8'))
          if d.get('execution_model')!='CONDITIONAL_PLAN_V1' or d.get('plan_version')!='conditional-plan-v1':
              raise SystemExit('V1 D is not conditional-plan-v1')
          if e.get('execution_model')!='CONDITIONAL_PLAN_V1' or e.get('plan_version')!='conditional-plan-v1':
              raise SystemExit('V1 E is not conditional-plan-v1')
          if v2.get('execution_model')!='V2_CONDITIONAL_PLAN_V1' or v2.get('plan_version')!='v2-conditional-plan-v1':
              raise SystemExit('V2 is not v2-conditional-plan-v1')

          for item in d.get('decisions') or []:
              if (item.get('trade_plan') or {}).get('plan_version')!='conditional-plan-v1':
                  raise SystemExit('V1 D contains a legacy pending entry')
          for fund in e.get('funds') or []:
              for item in fund.get('pending_targets') or []:
                  if (item.get('trade_plan') or {}).get('plan_version')!='conditional-plan-v1':
                      raise SystemExit(f'V1 {fund.get("id")} contains a legacy pending entry')
              for holding in fund.get('holdings') or []:
                  if (holding.get('exit_plan') or {}).get('plan_version')!='conditional-plan-v1':
                      raise SystemExit(f'V1 {fund.get("id")} holding missing exit plan')
          for fid,fund in (v2.get('funds') or {}).items():
              pending=fund.get('pending_decision')
              if pending:
                  if pending.get('plan_version')!='v2-conditional-plan-v1':
                      raise SystemExit(f'V2 {fid} pending version mismatch')
                  for item in pending.get('targets') or []:
                      if (item.get('trade_plan') or {}).get('plan_version')!='v2-conditional-plan-v1':
                          raise SystemExit(f'V2 {fid} contains a legacy pending entry')
              for holding in fund.get('holdings') or []:
                  if (holding.get('exit_plan') or {}).get('plan_version')!='v2-conditional-plan-v1':
                      raise SystemExit(f'V2 {fid} holding missing exit plan')
          print('LOCAL CONDITIONAL DATA INVARIANTS PASS')
          PY
          grep -q "09:40本身不等于卖出\|时钟本身不是卖出信号" web/d/app.js
          grep -q "没有合格的新买点" web/e/app.js
          grep -q "09:40本身不等于卖出" web/v2/app.js
          if grep -q "下一交易日开盘模拟执行" web/d/app.js web/e/app.js web/v2/app.js; then
            echo "Legacy fixed-open UI wording survived" >&2
            exit 1
          fi

      - name: 收盘后拒绝发布过期 V1 结算
        id: v1_freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          from engine.schedule_guard import exchange_calendar_latest_session
          from engine.v1_freshness import assert_v1_freshness

          now=datetime.now(ZoneInfo('Asia/Shanghai'))
          today=now.date().isoformat()
          required=''
          if now.time() >= time(15,5):
              latest=exchange_calendar_latest_session(today)
              if latest == today:
                  assert_v1_freshness(today)
                  required=today
                  print(f'[deploy-freshness] current exchange session requires V1 date={today}')
              else:
                  print(f'[deploy-freshness] non-session day; latest exchange session={latest}')
          else:
              print('[deploy-freshness] before 15:05 Beijing; close-settlement freshness gate not active')

          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'required_date={required}\n')
          PY

      - name: 准备 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 公网验收数据和前端文件均与本次发布完全一致
        id: verify_public
        shell: bash
        env:
          DEPLOYED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          V1_REQUIRED_DATE: ${{ steps.v1_freshness.outputs.required_date }}
        run: |
          set -euo pipefail
          files=(
            "d/data.json"
            "e/data.json"
            "v2/data.json"
            "d/app.js"
            "e/app.js"
            "v2/app.js"
          )
          for file in "${files[@]}"; do
            key="$(echo "$file" | tr '/.' '__' | tr '[:lower:]' '[:upper:]')"
            expected="$(sha256sum "web/$file" | awk '{print $1}')"
            export "EXPECTED_${key}=$expected"
            echo "expected $file=$expected"
          done

          for i in $(seq 1 36); do
            ok=1
            for file in "${files[@]}"; do
              safe="$(echo "$file" | tr '/' '-')"
              curl -fsS --connect-timeout 5 --max-time 20 \
                "https://ghzyzttxwd.github.io/ai-stock-lab/${file}?verify=${DEPLOYED_SOURCE_SHA}-${GITHUB_RUN_ID}-${i}" \
                -o "/tmp/live-${safe}" || ok=0
            done
            if [ "$ok" = "1" ]; then
              all_match=1
              for file in "${files[@]}"; do
                safe="$(echo "$file" | tr '/' '-')"
                key="$(echo "$file" | tr '/.' '__' | tr '[:lower:]' '[:upper:]')"
                expected_var="EXPECTED_${key}"
                expected="${!expected_var}"
                actual="$(sha256sum "/tmp/live-${safe}" | awk '{print $1}')"
                echo "attempt=$i $file=$actual"
                if [ "$actual" != "$expected" ]; then all_match=0; fi
              done
              if [ "$all_match" = "1" ]; then
                python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          d=json.load(open('/tmp/live-d-data.json',encoding='utf-8'))
          e=json.load(open('/tmp/live-e-data.json',encoding='utf-8'))
          v2=json.load(open('/tmp/live-v2-data.json',encoding='utf-8'))
          if (d.get('execution_model'),d.get('plan_version')) != ('CONDITIONAL_PLAN_V1','conditional-plan-v1'):
              raise SystemExit('public V1 D model mismatch')
          if (e.get('execution_model'),e.get('plan_version')) != ('CONDITIONAL_PLAN_V1','conditional-plan-v1'):
              raise SystemExit('public V1 E model mismatch')
          if (v2.get('execution_model'),v2.get('plan_version')) != ('V2_CONDITIONAL_PLAN_V1','v2-conditional-plan-v1'):
              raise SystemExit('public V2 model mismatch')

          required=os.environ.get('V1_REQUIRED_DATE','').strip()
          if required:
              for label,payload in (('D',d),('E',e)):
                  actual=str(payload.get('updated_at') or '')[:10]
                  if actual != required:
                      raise SystemExit(
                          f'public V1 {label} stale: updated_at={actual or "missing"}, required={required}'
                      )

          d_js=Path('/tmp/live-d-app.js').read_text(encoding='utf-8')
          e_js=Path('/tmp/live-e-app.js').read_text(encoding='utf-8')
          v2_js=Path('/tmp/live-v2-app.js').read_text(encoding='utf-8')
          if '下一交易日开盘模拟执行' in d_js+e_js+v2_js:
              raise SystemExit('public UI still contains legacy forced-open wording')
          if '时钟本身不是卖出信号' not in d_js:
              raise SystemExit('public D UI does not explain conditional exit semantics')
          if '没有合格的新买点' not in e_js:
              raise SystemExit('public E UI does not expose cash/no-trade semantics')
          if '09:40本身不等于卖出' not in v2_js:
              raise SystemExit('public V2 UI does not expose conditional exit semantics')

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt={
              'status':'verified',
              'source_commit':os.environ['DEPLOYED_SOURCE_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'execution_model_v1':'CONDITIONAL_PLAN_V1',
              'plan_version_v1':'conditional-plan-v1',
              'execution_model_v2':'V2_CONDITIONAL_PLAN_V1',
              'plan_version_v2':'v2-conditional-plan-v1',
              'v1_required_date':required or None,
              'forced_clock_buy':False,
              'forced_clock_sell':False,
              'verified_files':{
                  'd/data.json':digest('/tmp/live-d-data.json'),
                  'e/data.json':digest('/tmp/live-e-data.json'),
                  'v2/data.json':digest('/tmp/live-v2-data.json'),
                  'd/app.js':digest('/tmp/live-d-app.js'),
                  'e/app.js':digest('/tmp/live-e-app.js'),
                  'v2/app.js':digest('/tmp/live-v2-app.js'),
              },
              'updated_at':d.get('updated_at'),
              'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'public_urls':{
                  'd':'https://ghzyzttxwd.github.io/ai-stock-lab/d/',
                  'e':'https://ghzyzttxwd.github.io/ai-stock-lab/e/',
                  'v2':'https://ghzyzttxwd.github.io/ai-stock-lab/v2/',
              },
          }
          Path('/tmp/conditional-pages-full-verification.json').write_text(
              json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print('PUBLIC CONDITIONAL DATA + UI VERIFIED')
          PY
                exit 0
              fi
            fi
            sleep 5
          done
          echo "公网数据或前端文件与本次发布不一致，禁止判定成功。"
          exit 1

      - name: 持久化条件计划公网验收回执
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/conditional-pages-full-verification.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p state
          cp /tmp/conditional-pages-full-verification.json state/conditional_pages_full_verification.json
          git config user.name "pages-verification-bot"
          git config user.email "pages-verification-bot@users.noreply.github.com"
          git add state/conditional_pages_full_verification.json
          if git diff --cached --quiet; then
            echo "Verification receipt unchanged."
            exit 0
          fi
          git commit -m "ops: verify conditional data and UI on public Pages"
          git pull --rebase origin main
          git push origin HEAD:main
