name: V3 autonomous AI paper trading

on:
  workflow_dispatch:
  push:
    branches: [v3-agent-paper]
    paths:
      - 'engine_v3/**'
      - 'tests/test_v3*.py'
      - '.github/workflows/v3-agent-paper.yml'
      - 'agent_state/v3/.run-trigger'
      - 'agent_state/v3/decisions/**'

permissions:
  contents: write

concurrency:
  group: v3-agent-paper
  cancel-in-progress: false

jobs:
  prepare-and-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-agent-paper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test V3 before touching paper state
        run: python -m unittest discover -s tests -p 'test_v3*.py' -v

      - name: Resolve latest completed session
        id: td
        run: |
          TD=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from engine_v2.data_validation import _safe_requested_date
          print(_safe_requested_date(datetime.now(ZoneInfo('Asia/Shanghai'))).isoformat())
          PY
          )
          echo "date=$TD" >> "$GITHUB_OUTPUT"

      - name: Settle every due AI decision from exact-date critical bars
        run: |
          python -m engine_v3.catch_up \
            --as-of "${{ steps.td.outputs.date }}" \
            --report /tmp/v3-catch-up.json

      - name: Persist due V3 execution before market research
        run: |
          set -euo pipefail
          git config user.name "v3-agent-paper-bot"
          git config user.email "v3-agent-paper-bot@users.noreply.github.com"
          for path in agent_state/v3/audit agent_state/v3/ledgers; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new due V3 execution state to persist"
            exit 0
          fi
          git commit -m "v3-data: persist due autonomous paper execution"
          git pull --rebase origin v3-agent-paper
          git push origin HEAD:v3-agent-paper

      - name: Resolve next session and immutable brief reuse
        id: brief
        shell: bash
        run: |
          set -euo pipefail
          NEXT=$(python - <<'PY'
          from engine_v3.calendar import next_trade_session
          print(next_trade_session('${{ steps.td.outputs.date }}'))
          PY
          )
          echo "next_date=$NEXT" >> "$GITHUB_OUTPUT"
          BRIEF="agent_state/v3/briefs/${{ steps.td.outputs.date }}.json"
          DECISION="agent_state/v3/decisions/${{ steps.td.outputs.date }}.json"
          if [[ -f "$BRIEF" ]]; then
            python - "$BRIEF" "$DECISION" "${{ steps.td.outputs.date }}" "$NEXT" <<'PY'
          import json
          import sys
          from pathlib import Path

          brief_path, decision_path, trade_date, next_date = sys.argv[1:]
          brief = json.load(open(brief_path, encoding='utf-8'))
          if brief.get('trade_date') != trade_date:
              raise SystemExit('stored brief trade_date mismatch')
          if brief.get('next_trade_date') != next_date:
              raise SystemExit('stored brief next_trade_date mismatch')
          if Path(decision_path).exists():
              decision = json.load(open(decision_path, encoding='utf-8'))
              if decision.get('decision_date') != trade_date:
                  raise SystemExit('decision_date mismatch')
              if decision.get('execute_on') != next_date:
                  raise SystemExit('decision execute_on mismatch')
              if decision.get('brief_source_sha256') != brief.get('source_sha256'):
                  raise SystemExit('decision/brief source hash mismatch; immutable evidence changed')
          PY
            cp "$BRIEF" agent_state/v3/latest_brief.json
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable V3 brief $BRIEF"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build one decision-grade market snapshot only for a new brief
        if: steps.brief.outputs.reuse != 'true'
        env:
          V2_UNIVERSE_CACHE_PATH: ${{ github.workspace }}/agent_state/v3/cache/market_universe.json
          V2_DECISION_SNAPSHOT_CACHE_PATH: ${{ github.workspace }}/agent_state/v3/cache/normalized_snapshot.json
          V2_HISTORY_CACHE_DIR: ${{ github.workspace }}/.cache/v3-history
          V2_HISTORY_WORKERS: '3'
        run: |
          python -m engine_v2.resilient_snapshot --date "${{ steps.td.outputs.date }}" --output /tmp/v3-snapshot.json
          python -m engine_v2.enrichment_resilient --snapshot /tmp/v3-snapshot.json --output /tmp/v3-enriched.json

      - name: Build a new immutable AI brief when missing
        if: steps.brief.outputs.reuse != 'true'
        run: |
          BRIEF="agent_state/v3/briefs/${{ steps.td.outputs.date }}.json"
          python -m engine_v3.brief \
            --snapshot /tmp/v3-snapshot.json \
            --enriched /tmp/v3-enriched.json \
            --next-trade-date "${{ steps.brief.outputs.next_date }}" \
            --output "$BRIEF"
          cp "$BRIEF" agent_state/v3/latest_brief.json

      - name: Build V3 public data mirror
        run: |
          python -m engine_v3.reporting \
            --trade-date "${{ steps.td.outputs.date }}" \
            --output web/v3/data.json

      - name: Prove V1/V2 isolation and V3 output completeness
        run: |
          git diff --quiet -- state shadow_state/v2 web/d web/e web/v2
          python - <<'PY'
          import json
          from pathlib import Path
          brief=json.load(open('agent_state/v3/latest_brief.json',encoding='utf-8'))
          summary=json.load(open('web/v3/data.json',encoding='utf-8'))
          if brief['trade_date'] != '${{ steps.td.outputs.date }}': raise SystemExit('stale V3 brief')
          if brief['next_trade_date'] != '${{ steps.brief.outputs.next_date }}': raise SystemExit('next-session mismatch')
          if len(brief['candidates']) < 100: raise SystemExit('undersized AI brief')
          if set(summary['funds']) != {'A','B','C','D','L'}: raise SystemExit('fund set mismatch')
          if summary['mode'] != 'AUTONOMOUS_AI_PAPER': raise SystemExit('not paper mode')
          for fund_id in ('A','B','C','D','L'):
              path=Path('agent_state/v3/ledgers')/f'{fund_id}.json'
              if not path.exists(): raise SystemExit(f'missing V3 ledger {fund_id}')
              state=json.load(open(path,encoding='utf-8'))
              if state.get('last_processed_date') != '${{ steps.td.outputs.date }}':
                  raise SystemExit(f'stale V3 ledger {fund_id}: {state.get("last_processed_date")}')
              if float(state.get('cash') or 0) < -0.01: raise SystemExit(f'negative cash {fund_id}')
          PY

      - name: Persist V3 only
        run: |
          git config user.name "v3-agent-paper-bot"
          git config user.email "v3-agent-paper-bot@users.noreply.github.com"
          git add agent_state/v3 web/v3/data.json
          git diff --cached --quiet || git commit -m "v3-data: settle and prepare autonomous AI paper session"
          git pull --rebase origin v3-agent-paper
          git push origin HEAD:v3-agent-paper

      - name: Sync V3 public mirror to main
        run: |
          git fetch origin main
          rm -rf /tmp/v3-pages-main
          git worktree add /tmp/v3-pages-main origin/main
          cp web/v3/data.json /tmp/v3-pages-main/web/v3/data.json
          cd /tmp/v3-pages-main
          git config user.name "v3-agent-paper-bot"
          git config user.email "v3-agent-paper-bot@users.noreply.github.com"
          git add web/v3/data.json
          if git diff --cached --quiet; then
            echo "V3 public mirror already current"
            exit 0
          fi
          git commit -m "v3-data: sync autonomous paper mirror to public site"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            cp "$GITHUB_WORKSPACE/web/v3/data.json" web/v3/data.json
            git add web/v3/data.json
            git commit -m "v3-data: sync autonomous paper mirror to public site"
            sleep $((attempt * 3))
          done
          echo "Failed to sync V3 public mirror after 3 conflict-safe attempts" >&2
          exit 1

      - name: Confirm dedicated terminal publisher exists on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e origin/main:.github/workflows/v3-pages-terminal.yml
          echo "Dedicated V3 Pages terminal publisher is present on main."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-agent-paper-${{ steps.td.outputs.date }}
          path: |
            /tmp/v3-snapshot.json
            /tmp/v3-enriched.json
            /tmp/v3-catch-up.json
            agent_state/v3/latest_brief.json
            agent_state/v3/public_verification.json
          if-no-files-found: warn
          retention-days: 30
