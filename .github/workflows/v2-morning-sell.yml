name: V2 morning 09:40 sell (isolated)

on:
  workflow_dispatch:
  schedule:
    - cron: '40 1 * * 1-5'  # 09:40 Beijing, Monday-Friday

permissions:
  contents: write

concurrency:
  group: v2-snapshot-smoke
  cancel-in-progress: false

jobs:
  morning-sell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-shadow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run V2 regression tests before mutation
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
      - name: Resolve Beijing date
        id: td
        run: |
          TD=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat())
          PY
          )
          echo "date=$TD" >> "$GITHUB_OUTPUT"
          echo "trade_date=$TD"
      - name: Execute only prior-session SELL/reduce intents at live quote
        run: |
          python -m engine_v2.morning_sell_run \
            --date "${{ steps.td.outputs.date }}" \
            --state-root shadow_state/v2 \
            --report /tmp/v2-morning-sell.json
      - name: Build intraday V2 summary
        run: |
          python -m engine_v2.shadow_reporting \
            --state-root shadow_state/v2 \
            --output shadow_state/v2/summary.json \
            --web-output web/v2/data.json
      - name: Assert V2 isolation
        shell: bash
        run: |
          git diff --quiet -- state web/d web/e
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v2-morning-sell.json',encoding='utf-8'))
          safety=r.get('safety') or {}
          if safety.get('calls_sol') or safety.get('reads_v1_ledger') or safety.get('writes_v1_ledger'):
              raise SystemExit('V2 morning isolation invariant violated')
          print('[V2 MORNING]',r.get('status'),r.get('trade_date'),r.get('fills'))
          PY
      - name: Persist only isolated V2 morning state
        shell: bash
        run: |
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add shadow_state/v2 web/v2/data.json
          if git diff --cached --quiet; then
            echo "No V2 morning state change."
          else
            git commit -m "v2-data: 09:40 sell and intraday valuation"
            git pull --rebase origin v2-shadow
            git push origin HEAD:v2-shadow
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-morning-sell-${{ steps.td.outputs.date }}
          path: /tmp/v2-morning-sell.json
          if-no-files-found: warn
          retention-days: 30
