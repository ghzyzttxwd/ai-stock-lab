name: V2 intraday conditional exit checks (isolated)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shadow_state/v2/.morning-trigger'
  schedule:
    - cron: '40 1 * * 1-5'  # 09:40 Beijing
    - cron: '30 2 * * 1-5'  # 10:30 Beijing
    - cron: '20 3 * * 1-5'  # 11:20 Beijing
    - cron: '30 5 * * 1-5'  # 13:30 Beijing
    - cron: '30 6 * * 1-5'  # 14:30 Beijing
    - cron: '55 6 * * 1-5'  # 14:55 Beijing / max-hold exit

permissions:
  contents: write
  actions: write

concurrency:
  group: v2-morning-sell
  cancel-in-progress: false

jobs:
  morning-sell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-shadow
          fetch-depth: 0

      - name: Resolve Beijing date and logical checkpoint
        id: td
        shell: bash
        run: |
          TD=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat())
          PY
          )
          case "${{ github.event.schedule }}" in
            '40 1 * * 1-5') slot='09:40' ;;
            '30 2 * * 1-5') slot='10:30' ;;
            '20 3 * * 1-5') slot='11:20' ;;
            '30 5 * * 1-5') slot='13:30' ;;
            '30 6 * * 1-5') slot='14:30' ;;
            '55 6 * * 1-5') slot='14:55' ;;
            *) slot="$(TZ=Asia/Shanghai date +%H:%M)" ;;
          esac
          echo "date=$TD" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "slot_key=${slot/:/}" >> "$GITHUB_OUTPUT"
          echo "trade_date=$TD checkpoint=$slot"

      - name: Record V2 conditional-exit run start without rolling status backward
        shell: bash
        env:
          CHECKPOINT: ${{ steps.td.outputs.slot }}
          TRADE_DATE: ${{ steps.td.outputs.date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          status={
              'status':'started',
              'trade_date':os.environ['TRADE_DATE'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'event_name':os.environ.get('GITHUB_EVENT_NAME'),
              'source_sha':os.environ.get('GITHUB_SHA'),
              'scheduled_time':os.environ.get('CHECKPOINT'),
              'started_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          open('/tmp/v2-morning-job-status.json','w',encoding='utf-8').write(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf /tmp/main-status
          git fetch origin main
          git worktree add --detach /tmp/main-status origin/main
          cd /tmp/main-status
          git config user.name "v2-morning-status-bot"
          git config user.email "v2-morning-status-bot@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            cp /tmp/v2-morning-job-status.json state/v2_morning_last_attempt.json
            python - <<'PY'
          import json
          from pathlib import Path
          order={'09:40':0,'10:30':1,'11:20':2,'13:30':3,'14:30':4,'14:55':5}
          candidate=json.load(open('/tmp/v2-morning-job-status.json',encoding='utf-8'))
          target=Path('state/v2_morning_job_status.json')
          existing=json.loads(target.read_text(encoding='utf-8')) if target.exists() else None
          def key(x):
              if not x: return ('',-1)
              date=x.get('trade_date') or str(x.get('finished_at_utc') or x.get('started_at_utc') or '')[:10]
              return (date, order.get(x.get('scheduled_time'),-1))
          if existing and key(existing)>key(candidate):
              print(f'[MONOTONIC STATUS] preserve newer {key(existing)} over {key(candidate)}')
          else:
              target.write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add state/v2_morning_last_attempt.json state/v2_morning_job_status.json
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "ops: V2 conditional-exit run started"
            if git push origin HEAD:main; then pushed=1; break; fi
          done
          test "$pushed" = "1"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Refresh V2 branch before regression and mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v2-shadow
          git reset --hard origin/v2-shadow

      - name: Run V2 regression tests before mutation
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v

      - name: Check protective and profit exit conditions at live quote
        run: |
          python -m engine_v2.morning_sell_run \
            --date "${{ steps.td.outputs.date }}" \
            --scheduled-time "${{ steps.td.outputs.slot }}" \
            --state-root shadow_state/v2 \
            --report /tmp/v2-morning-sell.json

      - name: Classify checkpoint result
        id: checkpoint_gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/v2-morning-sell.json',encoding='utf-8'))
          safety=r.get('safety') or {}
          if safety.get('calls_sol') or safety.get('reads_v1_ledger') or safety.get('writes_v1_ledger'):
              raise SystemExit('V2 conditional-exit isolation invariant violated')
          status=r.get('status')
          if status=='late_duplicate_noop':
              if safety.get('reads_market_quotes') or safety.get('mutates_v2_ledger') or safety.get('forced_clock_sell'):
                  raise SystemExit('late duplicate no-op violated fail-closed safety')
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write('continue=false\n')
                  f.write('late_duplicate=true\n')
              print('[V2 LATE DUPLICATE NO-OP]',r.get('scheduled_time'),r.get('actual_clock'),r.get('delay_minutes'),r.get('event_hash'))
              raise SystemExit(0)
          allowed={'conditional_exit_processed','already_conditional_exit_scan','already_processed','not_exchange_session'}
          if status not in allowed:
              raise SystemExit(f'V2 checkpoint was not operationally completed: {status}')
          if status in {'conditional_exit_processed','already_conditional_exit_scan'} and r.get('execution_model')!='V2_CONDITIONAL_PLAN_V1':
              raise SystemExit('V2 intraday path is not conditional-plan model')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('continue=true\n')
              f.write('late_duplicate=false\n')
          print('[V2 CONDITIONAL EXIT]',status,r.get('trade_date'),r.get('scheduled_time'),r.get('fills'),r.get('executed_at'))
          PY

      - name: Verify mutated V2 audit and ledger core
        if: steps.checkpoint_gate.outputs.continue == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from engine_v2.shadow_reporting import verify_audit_chain
          result=verify_audit_chain(Path('shadow_state/v2'))
          if result.get('status')!='PASS':
              raise SystemExit(f'V2 mutated core verification failed: {result}')
          print('[V2 CORE VERIFIED]',result)
          PY

      - name: Persist V2 audit and ledger core before derived reporting
        if: steps.checkpoint_gate.outputs.continue == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add shadow_state/v2/audit shadow_state/v2/ledgers
          if git diff --cached --quiet; then
            echo "No V2 core mutation to persist."
          else
            git commit -m "v2-data: persist conditional-exit core"
            git pull --rebase origin v2-shadow
            git push origin HEAD:v2-shadow
          fi
          touch /tmp/v2-core-durable

      - name: Build intraday V2 summary
        if: steps.checkpoint_gate.outputs.continue == 'true'
        run: |
          python -m engine_v2.shadow_reporting \
            --state-root shadow_state/v2 \
            --output shadow_state/v2/summary.json \
            --web-output web/v2/data.json

      - name: Verify generated V2 web after reporting
        if: steps.checkpoint_gate.outputs.continue == 'true'
        run: python -m unittest discover -s tests -p 'test_v2_web.py' -v

      - name: Assert V2 conditional-exit isolation
        if: steps.checkpoint_gate.outputs.continue == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- state web/d web/e
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v2-morning-sell.json',encoding='utf-8'))
          safety=r.get('safety') or {}
          if safety.get('calls_sol') or safety.get('reads_v1_ledger') or safety.get('writes_v1_ledger'):
              raise SystemExit('V2 conditional-exit isolation invariant violated')
          if safety.get('forced_clock_sell'):
              raise SystemExit('V2 conditional-exit attempted a forced clock sale')
          PY

      - name: Persist derived V2 summary and web data
        if: steps.checkpoint_gate.outputs.continue == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add shadow_state/v2/summary.json web/v2/data.json
          if git diff --cached --quiet; then
            echo "No derived V2 checkpoint state change."
          else
            git commit -m "v2-data: conditional exit checkpoint summary"
            git pull --rebase origin v2-shadow
            git push origin HEAD:v2-shadow
          fi

      - name: Sync latest V2 web data into main and verify hash
        if: steps.checkpoint_gate.outputs.continue == 'true'
        id: sync_main
        shell: bash
        run: |
          set -euo pipefail
          cp web/v2/data.json /tmp/v2-data.json
          expected="$(sha256sum /tmp/v2-data.json | awk '{print $1}')"
          echo "expected_sha256=$expected" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/main-sync
          git fetch origin main
          git worktree add --detach /tmp/main-sync origin/main
          cd /tmp/main-sync
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          synced=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-data.json web/v2/data.json
            git add web/v2/data.json
            if git diff --cached --quiet; then synced=1; break; fi
            git commit -m "v2-data: sync conditional-exit web data to main"
            if git push origin HEAD:main; then synced=1; break; fi
          done
          test "$synced" = "1"
          git fetch origin main
          actual="$(git show origin/main:web/v2/data.json | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Dispatch canonical Pages deployment from main
        if: steps.checkpoint_gate.outputs.continue == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/auto-deploy.yml/dispatches" -d '{"ref":"main"}')
          echo "dispatch_http_code=$code"
          test "$code" = "204"

      - name: Verify public V2 data equals conditional-exit result
        if: steps.checkpoint_gate.outputs.continue == 'true'
        id: verify_public
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.sync_main.outputs.expected_sha256 }}"
          for i in $(seq 1 60); do
            url="https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}"
            if curl -fsS --connect-timeout 5 --max-time 20 "$url" -o /tmp/live-v2-data.json; then
              actual="$(sha256sum /tmp/live-v2-data.json | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                echo "actual_sha256=$actual" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public V2 data still differs from conditional-exit result."
          exit 1

      - name: Persist V2 conditional-exit end-to-end receipt monotonically
        if: steps.checkpoint_gate.outputs.continue == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.sync_main.outputs.expected_sha256 }}
          PUBLIC_SHA256: ${{ steps.verify_public.outputs.actual_sha256 }}
          TRADE_DATE: ${{ steps.td.outputs.date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report=json.load(open('/tmp/v2-morning-sell.json',encoding='utf-8'))
          if os.environ['EXPECTED_SHA256']!=os.environ['PUBLIC_SHA256']:
              raise SystemExit('conditional-exit public hash mismatch')
          receipt={
              'status':'verified','trade_date':os.environ['TRADE_DATE'],
              'conditional_exit_status':report.get('status'),'event_hash':report.get('event_hash'),
              'scheduled_time':report.get('scheduled_time'),'executed_at':report.get('executed_at'),
              'actual_clock':report.get('actual_clock'),'delay_minutes':report.get('delay_minutes'),
              'execution_model':report.get('execution_model'),'plan_version':report.get('plan_version'),
              'forced_clock_sell':False,'checkpoint_durable':True,'end_to_end_verified':True,
              'expected_sha256':os.environ['EXPECTED_SHA256'],'public_sha256':os.environ['PUBLIC_SHA256'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          open('/tmp/v2-morning-chain-verification.json','w',encoding='utf-8').write(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          PY
          cd /tmp/main-sync
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            python - <<'PY'
          import json
          from pathlib import Path
          order={'09:40':0,'10:30':1,'11:20':2,'13:30':3,'14:30':4,'14:55':5}
          candidate=json.load(open('/tmp/v2-morning-chain-verification.json',encoding='utf-8'))
          target=Path('state/v2_morning_chain_verification.json')
          existing=json.loads(target.read_text(encoding='utf-8')) if target.exists() else None
          def key(x):
              if not x: return ('',-1)
              return (x.get('trade_date') or '', order.get(x.get('scheduled_time'),-1))
          if existing and key(existing)>key(candidate):
              print(f'[MONOTONIC RECEIPT] preserve newer {key(existing)} over {key(candidate)}')
          else:
              target.write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add state/v2_morning_chain_verification.json
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "ops: persist V2 conditional-exit end-to-end receipt"
            if git push origin HEAD:main; then pushed=1; break; fi
          done
          test "$pushed" = "1"
          touch /tmp/v2-e2e-verified

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-conditional-exit-${{ steps.td.outputs.date }}-${{ steps.td.outputs.slot_key }}
          path: /tmp/v2-morning-sell.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist final V2 conditional-exit job status without rolling checkpoint backward
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKPOINT: ${{ steps.td.outputs.slot }}
          TRADE_DATE: ${{ steps.td.outputs.date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          report={}
          report_path=Path('/tmp/v2-morning-sell.json')
          if report_path.exists():
              report=json.loads(report_path.read_text(encoding='utf-8'))
          checkpoint_status=report.get('status')
          evaluated_fresh=checkpoint_status=='conditional_exit_processed'
          satisfied_by_existing=checkpoint_status in {'already_conditional_exit_scan','already_processed'}
          late_duplicate=checkpoint_status=='late_duplicate_noop'
          durable=Path('/tmp/v2-core-durable').exists()
          e2e=Path('/tmp/v2-e2e-verified').exists()
          display_status='late_duplicate_noop' if late_duplicate else os.environ['JOB_STATUS']
          status={
              'status':display_status,
              'trade_date':os.environ['TRADE_DATE'],
              'checkpoint_status':checkpoint_status,
              'checkpoint_evaluated_fresh':evaluated_fresh,
              'checkpoint_satisfied_by_existing':satisfied_by_existing,
              'late_duplicate_noop':late_duplicate,
              'checkpoint_durable':durable,
              'end_to_end_verified':e2e,
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'event_name':os.environ.get('GITHUB_EVENT_NAME'),
              'source_sha':os.environ.get('GITHUB_SHA'),
              'scheduled_time':os.environ.get('CHECKPOINT'),
              'actual_clock':report.get('actual_clock'),
              'delay_minutes':report.get('delay_minutes'),
              'event_hash':report.get('event_hash'),
              'finished_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          open('/tmp/v2-morning-job-status.json','w',encoding='utf-8').write(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          PY
          if [ ! -d /tmp/main-status/.git ] && [ ! -f /tmp/main-status/.git ]; then
            rm -rf /tmp/main-status
            git fetch origin main
            git worktree add --detach /tmp/main-status origin/main
          fi
          cd /tmp/main-status
          git config user.name "v2-morning-status-bot"
          git config user.email "v2-morning-status-bot@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            cp /tmp/v2-morning-job-status.json state/v2_morning_last_attempt.json
            python - <<'PY'
          import json
          from pathlib import Path
          order={'09:40':0,'10:30':1,'11:20':2,'13:30':3,'14:30':4,'14:55':5}
          candidate=json.load(open('/tmp/v2-morning-job-status.json',encoding='utf-8'))
          target=Path('state/v2_morning_job_status.json')
          existing=json.loads(target.read_text(encoding='utf-8')) if target.exists() else None
          def key(x):
              if not x: return ('',-1)
              date=x.get('trade_date') or str(x.get('finished_at_utc') or x.get('started_at_utc') or '')[:10]
              return (date, order.get(x.get('scheduled_time'),-1))
          if existing and key(existing)>key(candidate):
              print(f'[MONOTONIC STATUS] preserve newer {key(existing)} over {key(candidate)}')
          else:
              target.write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add state/v2_morning_last_attempt.json state/v2_morning_job_status.json
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "ops: V2 conditional-exit run ${JOB_STATUS}"
            if git push origin HEAD:main; then pushed=1; break; fi
          done
          test "$pushed" = "1"
