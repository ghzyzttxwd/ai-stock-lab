name: V2 15:10 conditional-plan settlement (isolated)

on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1-5'  # 15:10 Beijing primary
    - cron: '20 7 * * 1-5'  # 15:20 Beijing retry
    - cron: '30 7 * * 1-5'  # 15:30 Beijing final retry

permissions:
  contents: write
  actions: write

concurrency:
  group: v2-snapshot-smoke
  cancel-in-progress: false

jobs:
  evening-split:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-shadow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run V2 regression tests before accounting
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
      - name: Resolve Beijing trade date for completed session
        id: td
        run: |
          TD=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat())
          PY
          )
          echo "date=$TD" >> "$GITHUB_OUTPUT"
          echo "trade_date=$TD"
      - name: Check whether the daily session is already audited
        id: guard
        run: |
          python -m engine_v2.shadow_guard \
            --state-root shadow_state/v2 \
            --trade-date "${{ steps.td.outputs.date }}" \
            --report /tmp/v2-shadow-run.json
      - name: Migrate already-processed current session to conditional plans without changing economics
        if: steps.guard.outputs.done == 'true'
        run: |
          python -m engine_v2.conditional_migration \
            --date "${{ steps.td.outputs.date }}" \
            --state-root shadow_state/v2 \
            --report /tmp/v2-conditional-migration.json
      - name: Restore bounded Tencent history cache
        if: steps.guard.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/v2-history
          key: v2-history-${{ runner.os }}-${{ steps.td.outputs.date }}-${{ hashFiles('requirements.txt', 'engine_v2/history_cache.py') }}
          restore-keys: |
            v2-history-${{ runner.os }}-
      - name: Build one resilient decision snapshot
        if: steps.guard.outputs.done != 'true'
        run: python -m engine_v2.resilient_snapshot --date "${{ steps.td.outputs.date }}" --output /tmp/v2-normalized-snapshot.json
      - name: Enrich once with cached Tencent histories
        if: steps.guard.outputs.done != 'true'
        env:
          V2_HISTORY_CACHE_DIR: ${{ github.workspace }}/.cache/v2-history
          V2_HISTORY_WORKERS: '3'
        run: python -m engine_v2.enrichment_resilient --snapshot /tmp/v2-normalized-snapshot.json --output /tmp/v2-enriched-candidates.json
      - name: Settle only triggered entry conditions and build tomorrow conditional plans
        if: steps.guard.outputs.done != 'true'
        run: |
          python -m engine_v2.shadow_run_split \
            --snapshot /tmp/v2-normalized-snapshot.json \
            --enriched /tmp/v2-enriched-candidates.json \
            --state-root shadow_state/v2 \
            --report /tmp/v2-shadow-run.json
      - name: Build derived V2 comparison summary
        run: |
          python -m engine_v2.shadow_reporting \
            --state-root shadow_state/v2 \
            --output shadow_state/v2/summary.json \
            --web-output web/v2/data.json
      - name: Run V2 regression tests again against generated state and web
        run: python -m unittest discover -s tests -p 'test_v2*.py' -v
      - name: Assert isolation and conditional-plan invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- state web/d web/e
          python - <<'PY'
          import json
          from pathlib import Path
          web=json.load(open('web/v2/data.json',encoding='utf-8'))
          if web.get('summary_version') != 'v2-shadow-summary-1.2':
              raise SystemExit('V2 web summary schema mismatch')
          if web.get('execution_model') != 'V2_CONDITIONAL_PLAN_V1':
              raise SystemExit(f'V2 web execution model mismatch: {web.get("execution_model")}')
          if web.get('plan_version') != 'v2-conditional-plan-v1':
              raise SystemExit(f'V2 web plan version mismatch: {web.get("plan_version")}')
          for fid,fund in (web.get('funds') or {}).items():
              if fund.get('execution_model') != 'V2_CONDITIONAL_PLAN_V1':
                  raise SystemExit(f'V2 {fid} ledger is not conditional')
              pending=fund.get('pending_decision')
              if pending:
                  if pending.get('plan_version') != 'v2-conditional-plan-v1':
                      raise SystemExit(f'V2 {fid} pending plan version mismatch')
                  for target in pending.get('targets') or []:
                      if (target.get('trade_plan') or {}).get('plan_version') != 'v2-conditional-plan-v1':
                          raise SystemExit(f'V2 {fid} legacy target survived')
              for holding in fund.get('holdings') or []:
                  if (holding.get('exit_plan') or {}).get('plan_version') != 'v2-conditional-plan-v1':
                      raise SystemExit(f'V2 {fid} holding lacks conditional exit plan')
          print('[V2 CONDITIONAL] invariants verified')
          PY
      - name: Persist only V2 shadow state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          git add shadow_state/v2 web/v2/data.json
          if git diff --cached --quiet; then
            echo "V2 conditional state already persisted."
          else
            git commit -m "v2-data: conditional plans and trigger-based accounting"
            git pull --rebase origin v2-shadow
            git push origin HEAD:v2-shadow
          fi
      - name: Sync V2 web data into main
        id: sync_main
        shell: bash
        run: |
          set -euo pipefail
          cp web/v2/data.json /tmp/v2-1510-data.json
          expected="$(sha256sum /tmp/v2-1510-data.json | awk '{print $1}')"
          echo "expected_sha256=$expected" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/v2-1510-main
          git fetch origin main
          git worktree add --detach /tmp/v2-1510-main origin/main
          cd /tmp/v2-1510-main
          git config user.name "v2-shadow-bot"
          git config user.email "v2-shadow-bot@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-1510-data.json web/v2/data.json
            git add web/v2/data.json
            if git diff --cached --quiet; then
              pushed=1
              break
            fi
            git commit -m "v2-data: sync conditional-plan data to main"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
          done
          test "$pushed" = "1"
          git fetch origin main
          actual="$(git show origin/main:web/v2/data.json | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Dispatch canonical Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/v2-1510-dispatch.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/auto-deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch_http_code=$code"
          test "$code" = "204"
      - name: Verify public V2 data equals conditional-plan result
        id: verify_public
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.sync_main.outputs.expected_sha256 }}"
          for i in $(seq 1 60); do
            url="https://ghzyzttxwd.github.io/ai-stock-lab/v2/data.json?v2_conditional=${GITHUB_RUN_ID}-${i}"
            if curl -fsS --connect-timeout 5 --max-time 20 "$url" -o /tmp/live-v2-1510.json; then
              actual="$(sha256sum /tmp/live-v2-1510.json | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                python - <<'PY'
          import json
          live=json.load(open('/tmp/live-v2-1510.json',encoding='utf-8'))
          if live.get('execution_model')!='V2_CONDITIONAL_PLAN_V1' or live.get('plan_version')!='v2-conditional-plan-v1':
              raise SystemExit('public V2 is not conditional-plan model')
          print('PUBLIC V2 CONDITIONAL VERIFIED',live.get('updated_at'))
          PY
                echo "actual_sha256=$actual" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public V2 data still differs from conditional-plan result."
          exit 1
      - name: Persist V2 conditional end-to-end receipt
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.sync_main.outputs.expected_sha256 }}
          PUBLIC_SHA256: ${{ steps.verify_public.outputs.actual_sha256 }}
          TRADE_DATE: ${{ steps.td.outputs.date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
              'status':'verified',
              'trade_date':os.environ['TRADE_DATE'],
              'execution_model':'V2_CONDITIONAL_PLAN_V1',
              'plan_version':'v2-conditional-plan-v1',
              'buy_reference':'predeclared_price_condition',
              'forced_clock_buy':False,
              'forced_clock_sell':False,
              'expected_sha256':os.environ['EXPECTED_SHA256'],
              'public_sha256':os.environ['PUBLIC_SHA256'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          open('/tmp/v2-1510-chain-verification.json','w',encoding='utf-8').write(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          PY
          cd /tmp/v2-1510-main
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state
            cp /tmp/v2-1510-chain-verification.json state/v2_1510_chain_verification.json
            git add state/v2_1510_chain_verification.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ops: verify V2 conditional-plan chain"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-conditional-${{ steps.td.outputs.date }}
          path: |
            /tmp/v2-normalized-snapshot.json
            /tmp/v2-enriched-candidates.json
            /tmp/v2-shadow-run.json
            /tmp/v2-conditional-migration.json
          if-no-files-found: warn
          retention-days: 30
