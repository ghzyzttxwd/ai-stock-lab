name: AI正式级流式测试（不改账本）

on:
  workflow_dispatch:
  schedule:
    # 18:05 Beijing time (10:05 UTC), Monday-Friday, 15 minutes before production.
    - cron: '5 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-ai-test.yml'
      - 'engine/formal_ai_test.py'
      - 'engine/ai_manager.py'

permissions:
  contents: read

concurrency:
  group: formal-ai-preflight
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 读取最新代码
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 正式级 Sol 流式测试（单次决策，最多一次5xx重试，不改账本）
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python -m engine.formal_ai_test
