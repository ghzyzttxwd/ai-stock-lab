name: V1 market diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'state/.v1-diagnostic-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1-market-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Run V1 market safety regressions
        id: regression
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest \
            tests.test_current_bar_history \
            tests.test_schedule_guard_calendar \
            tests.test_split_execution -v

      - name: Run read-only V1 market probe
        id: probe
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: python -m engine.v1_market_diagnostic

      - name: Persist diagnostic receipt
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s state/v1_market_diagnostic.json ]; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          payload={
              'status':'diagnostic_workflow_failed_before_report',
              'install_outcome':os.environ.get('INSTALL_OUTCOME'),
              'regression_outcome':os.environ.get('REGRESSION_OUTCOME'),
              'probe_outcome':os.environ.get('PROBE_OUTCOME'),
              'generated_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
          }
          Path('state/v1_market_diagnostic.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY
          else
            python - <<'PY'
          import json, os
          from pathlib import Path

          path=Path('state/v1_market_diagnostic.json')
          payload=json.loads(path.read_text(encoding='utf-8'))
          payload['workflow_outcomes']={
              'install':os.environ.get('INSTALL_OUTCOME'),
              'regression':os.environ.get('REGRESSION_OUTCOME'),
              'probe':os.environ.get('PROBE_OUTCOME'),
          }
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi

          git config user.name "v1-diagnostic-bot"
          git config user.email "v1-diagnostic-bot@users.noreply.github.com"
          git add state/v1_market_diagnostic.json
          git diff --cached --quiet || git commit -m "ops: persist V1 market diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail workflow if diagnostic path did not run cleanly
        if: steps.install.outcome != 'success' || steps.regression.outcome != 'success' || steps.probe.outcome != 'success'
        run: exit 1
